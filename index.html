<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maple Boss Tracker Dashboard</title>
	<script>
		(function () {
			const saved = localStorage.getItem('mapleBossTracker.theme'); // TODO: Move to AppState?
			if (saved === 'light')
				document.documentElement.setAttribute('data-theme', 'light');
		})();
	</script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

		:root {
			--bg-void: #0a0c0f;
			--bg-panel: #12151a;
			--bg-card: #171b21;
			--bg-input: #0d1015;
			--hairline: #262b33;
			--hairline-soft: #1c2028;
			--text-primary: #e6e8eb;
			--text-secondary: #8b93a1;
			--text-muted: #5b6472;
			--maple-gold: #e3b341;
			--maple-gold-dim: #8a6a24;
			--warning-orange: #f59e0b;
			--warning-glow: rgba(245, 158, 11, 0.18);
			--success-green: #4fd97b;
			--success-glow: rgba(79, 217, 123, 0.18);
			--danger-red: #DC3545;
			--danger-glow: rgba(220, 53, 69, 0.18);
			--font-display: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			--font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
			--bg-button: #1d222a;
			--bg-button-hover: #262c36;
			--clear-hover-bg: #2a1518;
			--clear-hover-border: #b6413a;
			--clear-hover-text: #f28b82;
		}

		[data-theme="light"] {
			--bg-void: #f4f5f7;
			--bg-panel: #ffffff;
			--bg-card: #fbfbfc;
			--bg-input: #ffffff;
			--hairline: #d8dce2;
			--hairline-soft: #e4e7eb;
			--text-primary: #1c2028;
			--text-secondary: #4b5563;
			--text-muted: #8b93a1;
			--maple-gold: #b8860f;
			--maple-gold-dim: #d9b45c;
			--warning-orange: #c2740a;
			--warning-glow: rgba(194, 116, 10, 0.14);
			--success-green: #1f9d54;
			--success-glow: rgba(31, 157, 84, 0.14);
			--danger-red: #c22b3a;
			--danger-glow: rgba(194, 43, 58, 0.14);
			--bg-button: #ffffff;
			--bg-button-hover: #eef0f3;
			--clear-hover-bg: #fbe9ea;
			--clear-hover-border: #d9757e;
			--clear-hover-text: #b0303f;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background-color: var(--bg-void);
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227, 179, 65, 0.05), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79, 217, 123, 0.04), transparent);
			color: var(--text-primary);
			font-family: var(--font-display);
			margin: 0;
			padding: 32px 24px 64px;
			transition: background-color 0.2s ease, color 0.2s ease;
		}

		.header-container {
			max-width: 1160px;
			margin: 0 auto 28px;
			padding: 0 4px;
			display: flex;
			align-items: baseline;
			gap: 14px;
		}

		.maple-mark {
			width: 26px;
			height: 26px;
			flex-shrink: 0;
			color: var(--maple-gold);
			transform: translateY(3px);
		}

		.page-title {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: -0.02em;
			color: var(--text-primary);
			margin: 0;
		}

		.page-credits {
			font-size: 13px;
			color: var(--text-muted);
			margin: 0;
			font-weight: 500;
		}

		.page-credits::before {
			content: "— ";
		}

		.page-frame {
			max-width: 1160px;
			margin: 0 auto;
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			box-sizing: border-box;
			padding: 28px 28px 32px;
			width: 100%;
			border-radius: 10px;
		}

		.config-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-bottom: 22px;
			margin-bottom: 22px;
			border-bottom: 1px solid var(--hairline);
		}

		.tools-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-top: 22px;
			margin-top: 22px;
			border-top: 1px solid var(--hairline);
		}

		.form-group {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0;
		}

		label.main-label {
			font-weight: 700;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--text-secondary);
			min-width: unset;
		}

		input,
		select {
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 5px;
			color: var(--text-primary);
			font-family: var(--font-mono);
			font-size: 14px;
			padding: 6px 8px;
			transition: border-color 0.15s ease;
		}

		input:focus {
			outline: none;
			border-color: var(--maple-gold-dim);
		}

		input:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.input-channels,
		.input-time,
		.input-random {
			width: 56px;
			text-align: center;
		}

		input:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.time-unit-label {
			font-size: 13px;
			color: var(--text-muted);
			margin-right: 6px;
		}

		input[type="time"]::-webkit-calendar-picker-indicator {
			filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			-webkit-filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			opacity: 0.8;
		}

		#timerContainer {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
			gap: 14px;
		}

		.timer-container {
			background-color: var(--bg-card);
			border: 1px solid var(--hairline-soft);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 16px;
			width: auto;
			transition: border-color 0.2s ease;
		}

		.timer-container.is-soon {
			border-color: var(--warning-orange);
			box-shadow: 0 0 0 1px var(--warning-glow), 0 0 24px -6px var(--warning-glow);
		}

		.timer-container.is-soon span {
			color: var(--warning-orange);
		}

		.timer-container.is-ready {
			border-color: var(--success-green);
			box-shadow: 0 0 0 1px var(--success-glow), 0 0 24px -6px var(--success-glow);
		}

		.timer-container.is-ready span {
			color: var(--success-green);
		}

		.timer-container.is-spawned {
			border-color: var(--danger-red);
			box-shadow: 0 0 0 1px var(--danger-glow), 0 0 24px -6px var(--danger-glow);
		}

		.timer-container.is-spawned span {
			color: var(--danger-red);
		}

		.timer-container .row-top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		button {
			background-color: var(--bg-button);
			border: 1px solid var(--hairline);
			border-radius: 6px;
			color: var(--text-primary);
			cursor: pointer;
			font-family: var(--font-display);
			font-size: 13px;
			font-weight: 700;
			min-width: unset;
			padding: 8px 14px;
			transition: all 0.15s ease-in-out;
		}

		button:hover {
			background-color: var(--bg-button-hover);
			border-color: var(--maple-gold-dim);
			color: var(--maple-gold);
		}

		button:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-group {
			gap: 8px;
		}

		.styled-checkbox {
			appearance: none;
			-webkit-appearance: none;
			width: 16px;
			height: 16px;
			margin: 0;
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 4px;
			cursor: pointer;
			position: relative;
			transition: all 0.15s ease-in-out;
		}

		.styled-checkbox:hover {
			border-color: var(--maple-gold-dim);
		}

		.styled-checkbox:checked {
			background-color: var(--maple-gold);
			border-color: var(--maple-gold);
		}

		.styled-checkbox:checked::after {
			content: '';
			position: absolute;
			left: 4px;
			top: 1px;
			width: 4px;
			height: 8px;
			border: solid var(--bg-void);
			border-width: 0 2px 2px 0;
			transform: rotate(45deg);
		}

		.styled-checkbox:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-label {
			font-size: 13px;
			color: var(--text-secondary);
			cursor: pointer;
			user-select: none;
		}

		.record-input {
			width: 100%;
		}

		.respawn-label {
			font-size: 13px;
			font-weight: 600;
			color: var(--text-secondary);
			min-width: unset;
		}

		.range-label {
			font-size: 12px;
			font-weight: 500;
			color: var(--text-muted);
			font-family: var(--font-mono);
			min-width: unset;
		}

		.countdown-label {
			font-family: var(--font-mono);
			font-size: 20px;
			color: var(--maple-gold);
			font-weight: 700;
			min-width: unset;
			letter-spacing: 0.01em;
		}

		.clear-btn {
			align-self: flex-start;
			background: transparent;
			border-color: var(--hairline-soft);
			color: var(--text-muted);
			font-size: 12px;
			padding: 5px 10px;
		}

		.clear-btn:hover {
			background-color: var(--clear-hover-bg);
			border-color: var(--clear-hover-border);
			color: var(--clear-hover-text);
		}

		@media (max-width: 560px) {
			.page-frame {
				padding: 20px 16px;
				border-radius: 0;
			}

			.config-row {
				gap: 14px;
			}

			.tools-row {
				gap: 14px;
			}
		}

		.page-footer {
			margin-top: 28px;
			padding-top: 20px;
			border-top: 1px solid var(--hairline);
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}

		.footer-text {
			font-size: 13px;
			line-height: 1.6;
			color: var(--text-secondary);
			margin: 0 0 10px;
			max-width: 560px;
		}

		.footer-text:last-child {
			margin-bottom: 0;
		}

		.footer-text strong {
			color: var(--text-primary);
			font-weight: 700;
		}

		.theme-toggle {
			margin-left: auto;
			display: flex;
			align-items: center;
			align-self: center;
		}

		.options-menu-wrapper {
			position: relative;
			display: flex;
			align-items: center;
			align-self: center;
			margin-left: 12px;
		}

		.options-menu {
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			gap: 14px;
			min-width: 200px;
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			border-radius: 8px;
			padding: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
		}

		.options-menu[hidden] {
			display: none;
		}

		.options-menu .form-group {
			justify-content: space-between;
		}
	</style>
</head>

<body>
	<div class="header-container">
		<svg class="maple-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<path
				d="M12 1.5c.6 1.7 1 2.9 2 3.4.7-1 1.3-1.7 2.5-2-.1 1.3-.2 2.1.3 3.2 1-.5 1.7-.9 3-.8-.6 1.1-1 1.9-.9 3.1 1.1 0 1.9.1 2.9.8-1 .8-1.7 1.3-2 2.4 1 .3 1.7.6 2.4 1.6-1.2.4-2 .5-2.7 1.4.7.8 1.1 1.4 1.2 2.5-1.2-.2-2-.4-2.9.1.3 1 .5 1.8.1 2.9-1-.6-1.6-1.1-2.7-1-.1 1.1 0 1.9-.6 2.8-.8-.8-1.3-1.5-2.4-1.7-.2 1.1-.2 1.9-1 2.8-.8-.9-.8-1.7-1-2.8-1.1.2-1.6.9-2.4 1.7-.6-.9-.5-1.7-.6-2.8-1.1-.1-1.7.4-2.7 1-.4-1.1-.2-1.9.1-2.9-.9-.5-1.7-.3-2.9-.1.1-1.1.5-1.7 1.2-2.5-.7-.9-1.5-1-2.7-1.4.7-1 1.4-1.3 2.4-1.6-.3-1.1-1-1.6-2-2.4 1-.7 1.8-.8 2.9-.8.1-1.2-.3-2-.9-3.1 1.3-.1 2 .3 3 .8.5-1.1.4-1.9.3-3.2 1.2.3 1.8 1 2.5 2 1-.5 1.4-1.7 2-3.4z"
				fill="currentColor" />
			<path d="M12 14.5V22" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
		</svg>
		<div>
			<h1 class="page-title">Maple Boss Tracker</h1>
			<p class="page-credits">by Yoar</p>
		</div>
		<div class="theme-toggle">
			<button id="themeToggleButton" type="button">☀</button>
		</div>
		<div class="options-menu-wrapper">
			<button id="optionsToggleButton" type="button" aria-expanded="false" aria-controls="optionsMenu">⚙</button>
			<div id="optionsMenu" class="options-menu" hidden>
				<div class="form-group">
					<label for="channelsInput" class="main-label">Channels</label>
					<input type="number" id="channelsInput" class="input-channels">
				</div>
				<div class="form-group">
					<label for="delayRandPercInput" class="main-label">Randomization</label>
					<input type="number" id="delayRandPercInput" class="input-random" min="0" max="100" step="1" value="15">
					<span class="time-unit-label">%</span>
				</div>
				<div class="form-group checkbox-group">
					<input type="checkbox" id="formatLocalTimeCheckbox" class="styled-checkbox">
					<label for="formatLocalTimeCheckbox" class="checkbox-label">Format Local Time</label>
				</div>
				<div class="form-group checkbox-group">
					<input type="checkbox" id="syncModeCheckbox" class="styled-checkbox">
					<label for="syncModeCheckbox" class="checkbox-label">Sync Mode</label>
				</div>
			</div>
		</div>
	</div>

	<div class="page-frame">
		<!-- Configuration Panel -->
		<div class="config-row">
			<div class="form-group">
				<label for="bossSelect" class="main-label">Boss</label>
				<select id="bossSelect"></select>
			</div>
			<div class="form-group">
				<label class="main-label">Respawn Delay</label>
				<input type="number" id="delayHoursInput" class="input-time" min="0" step="1" value="1">
				<span class="time-unit-label">hr</span>
				<input type="number" id="delayMinutesInput" class="input-time" min="0" max="59" step="1" value="0">
				<span class="time-unit-label">min</span>
			</div>
		</div>

		<!-- Timer Containers -->
		<div id="timerContainer"></div>

		<!-- Tools Panel -->
		<div class="tools-row">
			<button id="copyLinkButton" type="button">Copy Link</button>
			<button id="copyTimersButton" type="button">Copy Timers</button>
			<button id="clearTimersButton" type="button">Clear Timers</button>
		</div>

		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
			import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
			import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

			const firebaseConfig = {
				apiKey: "AIzaSyDPrVhDm9TOj9UUZi0qB66QQD6acGZCUtw",
				authDomain: "maple-boss-timers.firebaseapp.com",
				projectId: "maple-boss-timers",
				storageBucket: "maple-boss-timers.firebasestorage.app",
				messagingSenderId: "22162905678",
				appId: "1:22162905678:web:eb27e0a4f869876a28011f"
			};

			const app = initializeApp(firebaseConfig);
			const db = getFirestore(app);
			const auth = getAuth(app);

			try {
				await signInAnonymously(auth);
				window.__firebase = { db, doc, setDoc, onSnapshot };
				window.onFirebaseReady?.();
			} catch (err) {
				console.error('Firebase init failed:', err);
			}
		</script>

		<script>
			/* Configurations */
			const CHANNELS_MIN = 1;
			const CHANNELS_MAX = 12;
			const CHANNELS_DEFAULT = 6;
			const DELAY_RAND_PERC_DEFAULT = 10;
			const APPSTATE_KEY = 'mapleBossTracker.appState';

			/* Get Element Handles */
			const bossSelect = document.getElementById('bossSelect');
			const delayHoursInput = document.getElementById('delayHoursInput');
			const delayMinutesInput = document.getElementById('delayMinutesInput');
			const channelsInput = document.getElementById('channelsInput');
			const delayRandPercInput = document.getElementById('delayRandPercInput');
			const timersContainer = document.getElementById('timerContainer');
			const formatLocalTimeCheckbox = document.getElementById('formatLocalTimeCheckbox');
			const syncModeCheckbox = document.getElementById('syncModeCheckbox');

			/* Boss Definitions */
			class BossDefinition {
				constructor(name, delayMinutes) {
					this.name = name;
					this.delayMinutes = delayMinutes;
				}
			}

			const bossDefinitions = [
				new BossDefinition('Unspecified', 60), // Default definition
				new BossDefinition('Deo', 60),
				new BossDefinition('Seruf', 60),
				new BossDefinition('Manon', 90),
				new BossDefinition('Leviathan', 240)
			];

			const bossDefinitionsCount = bossDefinitions.length;

			function getBossDefinition() {
				// Return default definition
				if (appState.bossIndex == 0) {
					const bossDefinition = bossDefinitions[0];

					bossDefinition.delayMinutes = appState.delayMinutes;

					return bossDefinition;
				}

				if (appState.bossIndex > 0 && appState.bossIndex < bossDefinitions.length)
					return bossDefinitions[appState.bossIndex];

				return null;
			}

			bossDefinitions.forEach((bossDefinition, index) => {
				const option = document.createElement('option');
				option.value = index;
				option.textContent = bossDefinition.name;
				bossSelect.appendChild(option);
			});

			/* AppState */
			class BossState {
				constructor() {
					this.pressTimes = new Array(CHANNELS_MAX).fill(null);
				}

				fromJson(json) {
					if ('pressTimes' in json)
						this.pressTimes = json.pressTimes.map(s => s === null ? null : new Date(s));
				}
			}

			class AppState {
				constructor() {
					this.channels = CHANNELS_DEFAULT;
					this.delayRandPerc = DELAY_RAND_PERC_DEFAULT;
					this.formatLocalTime = false;
					this.syncMode = false;
					this.roomId = null;
					this.bossIndex = 0;
					this.delayMinutes = 60;
					this.bossStates = new Array(bossDefinitionsCount);

					for (let i = 0; i < bossDefinitionsCount; i++)
						this.bossStates[i] = new BossState();
				}

				fromJson(json) {
					if ('channels' in json)
						this.channels = json.channels;

					if ('delayRandPerc' in json)
						this.delayRandPerc = json.delayRandPerc;

					if ('formatLocalTime' in json)
						this.formatLocalTime = json.formatLocalTime;

					if ('syncMode' in json)
						this.syncMode = json.syncMode;

					if ('roomId' in json)
						this.roomId = json.roomId;

					if ('bossIndex' in json)
						this.bossIndex = json.bossIndex;

					if ('delayMinutes' in json)
						this.delayMinutes = json.delayMinutes;

					if ('bossStates' in json) {
						for (let i = 0; i < bossDefinitionsCount && i < json.bossStates.length; i++)
							this.bossStates[i].fromJson(json.bossStates[i]);
					}
				}
			}

			const appState = new AppState();
			const remotePressTimes = new Array(CHANNELS_MAX).fill(null);

			function saveAppState() {
				localStorage.setItem(APPSTATE_KEY, JSON.stringify(appState));
			}

			function loadAppState() {
				const json = localStorage.getItem(APPSTATE_KEY);

				if (json === null)
					return;

				appState.fromJson(JSON.parse(json));
			}

			loadAppState();

			function getBossState() {
				if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length)
					return appState.bossStates[appState.bossIndex];

				return null;
			}

			function writePressTimesToFirestore(bossIndex, pressTimesMap) {
				const db = window.__firebase.db;
				const doc = window.__firebase.doc;
				const setDoc = window.__firebase.setDoc;

				const docRef = doc(db, 'rooms', appState.roomId, 'bosses', String(bossIndex));

				setDoc(docRef, { pressTimesMap }, { merge: true });
			}

			function writePressTimeToFirestore(bossIndex, channelIndex, pressTime) {
				const pressTimesMap = { [channelIndex]: pressTime };

				writePressTimesToFirestore(bossIndex, pressTimesMap);
			}

			function writeAllPressTimesToFirestore(bossIndex, pressTimes) {
				const pressTimesMap = Object.assign({}, pressTimes);

				writePressTimesToFirestore(bossIndex, pressTimesMap);
			}

			let unsubscribeFromBoss = null;

			function subscribeToBoss(bossIndex) {
				if (unsubscribeFromBoss)
					unsubscribeFromBoss();

				const db = window.__firebase.db;
				const doc = window.__firebase.doc;
				const onSnapshot = window.__firebase.onSnapshot;

				const docRef = doc(db, 'rooms', appState.roomId, 'bosses', String(bossIndex));

				unsubscribeFromBoss = onSnapshot(docRef, (snap) => {
					const data = snap.data();

					if (!data || !data.pressTimesMap)
						return;

					for (let i = 0; i < CHANNELS_MAX && i < remotePressTimes.length; i++) {
						const pressTimeEntry = data.pressTimesMap[i];

						remotePressTimes[i] = (pressTimeEntry == null ? null : pressTimeEntry.toDate()); // TODO: Need 'toDate'?
					}

					updateAllTimers();
					updateDocumentTitle();
				}, (err) => {
					console.error('Room subscription failed:', err);
				});
			}

			function onFirebaseReady() {
				if (appState.syncMode && appState.roomId !== null)
					subscribeToBoss(appState.bossIndex);
			}

			function getRemotePressTime(index) {
				if (index >= 0 && index < remotePressTimes.length)
					return remotePressTimes[index];

				return null;
			}

			// TODO: GetPressTimes function?

			function getPressTime(index) {
				// TODO: Check bounds?
				if (appState.syncMode)
					return remotePressTimes[index];
				else
					return getBossState().pressTimes[index];
			}

			function setPressTime(index, pressTime) {
				// TODO: Check bounds?
				if (appState.syncMode) {
					remotePressTimes[index] = pressTime;
					writePressTimeToFirestore(appState.bossIndex, index, pressTime);
				} else {
					getBossState().pressTimes[index] = pressTime;
					saveAppState();
				}
			}

			function updateDelayInputsDisabled() {
				const disabled = (appState.bossIndex != 0);
				delayHoursInput.disabled = disabled;
				delayMinutesInput.disabled = disabled;
			}

			function updateDelayInputsValue() {
				const delayMinutes = getBossDefinition().delayMinutes;
				delayHoursInput.value = Math.floor(delayMinutes / 60);
				delayMinutesInput.value = delayMinutes % 60;
			}

			/* URL Params */
			function savePressTimesParam() {
				const array = Array(CHANNELS_MAX);

				if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length) {
					const bossState = appState.bossStates[appState.bossIndex];

					for (let i = 0; i < CHANNELS_MAX && i < bossState.pressTimes.length; i++)
						array[i] = (bossState.pressTimes[i] === null ? '' : String(bossState.pressTimes[i].getTime()));
				}

				return array.join(',');
			}

			function loadPressTimesParam(param) {
				const split = param.split(',');

				if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length) {
					const bossState = appState.bossStates[appState.bossIndex];

					for (let i = 0; i < CHANNELS_MAX && i < bossState.pressTimes.length; i++)
						bossState.pressTimes[i] = (split[i] == '' ? null : new Date(Number(split[i])));
				}
			}

			function saveUrlParams() {
				const params = new URLSearchParams(window.location.search);

				params.set('boss', appState.bossIndex);

				if (appState.syncMode) {
					params.delete('pt');
					params.set('room', appState.roomId);
				} else {
					params.delete('room');
					params.set('pt', savePressTimesParam());
				}

				return params.toString();
			}

			function loadUrlParams() {
				const params = new URLSearchParams(window.location.search);
				const bossParam = params.get('boss');
				const ptParam = params.get('pt');
				const roomParam = params.get('room');

				if (bossParam)
					appState.bossIndex = parseInt(params.get('boss'));

				if (roomParam) {
					appState.syncMode = true;
					appState.roomId = roomParam;
				} else if (ptParam) {
					loadPressTimesParam(params.get('pt'));
				}

				if (bossParam || ptParam || roomParam)
					history.replaceState(null, '', window.location.pathname);
			}

			loadUrlParams();

			// TODO: Load the firestore press times asap?

			/* Initialize Inputs */
			bossSelect.value = appState.bossIndex;
			channelsInput.min = CHANNELS_MIN;
			channelsInput.max = CHANNELS_MAX;
			channelsInput.value = appState.channels;
			delayRandPercInput.value = appState.delayRandPerc;
			updateDelayInputsDisabled();
			updateDelayInputsValue();
			formatLocalTimeCheckbox.checked = appState.formatLocalTime;
			syncModeCheckbox.checked = appState.syncMode;

			/* Utility Functions */
			function clamp(value, min, max) {
				return Math.min(Math.max(value, min), max);
			}

			function toggleClass(element, classNames, classIndex) {
				for (let i = 0; i < classNames.length; i++) {
					element.classList.toggle(classNames[i], classIndex == i);
				}
			}

			function formatTime(time) {
				const hours = Math.floor(time / (1000 * 60 * 60));
				const minutes = Math.floor((time % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((time % (1000 * 60)) / 1000);

				const mm = minutes.toString().padStart(2, '0');
				const ss = seconds.toString().padStart(2, '0');

				if (hours > 0)
					return `${hours}:${mm}:${ss}`;
				else
					return `${mm}:${ss}`;
			}

			function timeStringToDate(timeString) {
				const now = new Date();
				const year = now.getFullYear();
				const MM = String(now.getMonth() + 1).padStart(2, '0');
				const DD = String(now.getDate()).padStart(2, '0');
				const dateString = `${year}-${MM}-${DD}`;
				const dateTimeString = `${dateString}T${timeString}`;
				const date = new Date(dateTimeString);
				const halfDayMs = 43200000; // 24 * 60 * 60 * 1000 / 2;

				// If it's at least 12 hours in the future, assume the user meant yesterday
				if ((date.getTime() - now.getTime()) > halfDayMs)
					date.setDate(date.getDate() - 1);

				return date;
			}

			function formatTimeIcon(time, delayVariationMs) {
				if (time <= -2 * delayVariationMs)
					return '⚠️';
				else if (time <= 0)
					return '✔️';
				else
					return formatTime(time);
			}

			/* Main Functions */
			const COUNTDOWN_STAGES = ['is-soon', 'is-ready', 'is-spawned'];
			const SOON_THRESHOLD_MS = 300000;
			const DOCUMENT_TITLE = document.title;

			function updateTimer(timerContainer, index) {
				const pressTime = getPressTime(index);

				const recordInput = timerContainer.querySelector('#recordInput');
				const respawnAvgLabel = timerContainer.querySelector('#respawnAvgLabel');
				const respawnMinLabel = timerContainer.querySelector('#respawnMinLabel');
				const respawnMaxLabel = timerContainer.querySelector('#respawnMaxLabel');
				const countdownLabel = timerContainer.querySelector('#countdownLabel');

				const recordInputFocused = recordInput && document.activeElement === recordInput;

				if (pressTime === null || isNaN(pressTime)) {
					if (recordInput && !recordInputFocused)
						recordInput.value = '';

					if (respawnAvgLabel)
						respawnAvgLabel.textContent = '';

					if (respawnMinLabel)
						respawnMinLabel.textContent = '';

					if (respawnMaxLabel)
						respawnMaxLabel.textContent = '';

					if (countdownLabel)
						countdownLabel.textContent = '';

					toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
				}
				else {
					const bossDefition = getBossDefinition();
					const delayMinutes = bossDefition.delayMinutes;
					const delayRandPerc = appState.delayRandPerc;

					const delayMs = delayMinutes * 60 * 1000;
					const delayRandMs = delayRandPerc * delayMs / 100;
					const respawnAvgTime = new Date(pressTime.getTime() + delayMs);
					const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
					const respawnMaxTime = new Date(respawnAvgTime.getTime() + delayRandMs);
					const now = new Date();
					const timeRemaining = respawnMinTime.getTime() - now.getTime();

					if (recordInput && !recordInputFocused) {
						const hh = String(pressTime.getHours()).padStart(2, '0');
						const mm = String(pressTime.getMinutes()).padStart(2, '0');

						recordInput.value = `${hh}:${mm}`;
					}

					if (respawnAvgLabel)
						respawnAvgLabel.textContent = `Expected Respawn: ${respawnAvgTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

					if (respawnMinLabel)
						respawnMinLabel.textContent = `Min Respawn: ${respawnMinTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

					if (respawnMaxLabel)
						respawnMaxLabel.textContent = `Max Respawn: ${respawnMaxTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

					if (countdownLabel) {
						if (timeRemaining <= -2 * delayRandMs) {
							toggleClass(timerContainer, COUNTDOWN_STAGES, 2);
							countdownLabel.textContent = "Spawned!";
						} else if (timeRemaining <= 0) {
							toggleClass(timerContainer, COUNTDOWN_STAGES, 1);
							countdownLabel.textContent = "Ready!";
						} else {
							if (timeRemaining <= SOON_THRESHOLD_MS)
								toggleClass(timerContainer, COUNTDOWN_STAGES, 0);
							else
								toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
							countdownLabel.textContent = `Remaining: ${formatTime(timeRemaining)}`;
						}
					}
				}
			}

			function createTimerContainer(index) {
				const timerContainer = document.createElement('div');
				timerContainer.className = 'timer-container';

				const recordButton = document.createElement('button');
				recordButton.textContent = `Channel ${index + 1}`;

				const recordInput = document.createElement('input');
				recordInput.id = 'recordInput';
				recordInput.className = "record-input"
				recordInput.type = "time";
				recordInput.min = "00:00"
				recordInput.max = "23:59"
				recordInput.step = "60"

				const respawnAvgLabel = document.createElement('span');
				respawnAvgLabel.id = 'respawnAvgLabel';
				respawnAvgLabel.className = 'respawn-label';

				const respawnMinLabel = document.createElement('span');
				respawnMinLabel.id = 'respawnMinLabel';
				respawnMinLabel.className = 'range-label';

				const respawnMaxLabel = document.createElement('span');
				respawnMaxLabel.id = 'respawnMaxLabel';
				respawnMaxLabel.className = 'range-label';

				const countdownLabel = document.createElement('span');
				countdownLabel.id = 'countdownLabel';
				countdownLabel.className = 'countdown-label';

				const clearButton = document.createElement('button');
				clearButton.textContent = 'Clear';
				clearButton.className = 'clear-btn';

				const rowTop = document.createElement('div');
				rowTop.className = 'row-top';

				recordButton.addEventListener('click', () => {
					setPressTime(index, new Date());
					updateTimer(timerContainer, index);
					updateDocumentTitle();
				});

				recordInput.addEventListener('change', (event) => {
					setPressTime(index, timeStringToDate(event.target.value));
					updateTimer(timerContainer, index);
					updateDocumentTitle();
				});

				clearButton.addEventListener('click', () => {
					setPressTime(index, null);
					updateTimer(timerContainer, index);
					updateDocumentTitle();
				});

				rowTop.appendChild(recordButton);
				rowTop.appendChild(clearButton);

				timerContainer.appendChild(rowTop);
				timerContainer.appendChild(recordInput);
				timerContainer.appendChild(countdownLabel);
				timerContainer.appendChild(respawnAvgLabel);
				timerContainer.appendChild(respawnMinLabel);
				timerContainer.appendChild(respawnMaxLabel);

				return timerContainer;
			}

			function ensureAllTimerContainers() {
				const channelCount = appState.channels;
				const currentCount = timersContainer.getElementsByClassName('timer-container').length;

				if (channelCount > currentCount) {
					for (let i = currentCount; i < channelCount; i++) {
						const timerContainer = createTimerContainer(i);

						timersContainer.appendChild(timerContainer);

						updateTimer(timerContainer, i);
					}
				} else if (channelCount < currentCount) {
					while (timersContainer.getElementsByClassName('timer-container').length > channelCount) {
						const lastRow = timersContainer.lastElementChild;

						timersContainer.removeChild(lastRow);
					}
				}
			}

			function formatDocumentTitle() {
				const bossDefition = getBossDefinition();
				const delayMinutes = bossDefition.delayMinutes;
				const delayRandPerc = appState.delayRandPerc;

				const delayMs = delayMinutes * 60 * 1000;
				const delayRandMs = delayRandPerc * delayMs / 100;

				const list = [];

				for (let i = 0; i < CHANNELS_MAX; i++) {
					const pressTime = getPressTime(i);

					if (pressTime === null)
						continue;

					const respawnAvgTime = new Date(pressTime.getTime() + delayMs);
					const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
					const now = new Date();
					const timeRemaining = respawnMinTime.getTime() - now.getTime();

					list.push({ channel: i + 1, timeRemaining: timeRemaining })
				}

				if (list.length == 0)
					return DOCUMENT_TITLE;

				list.sort((a, b) => a.timeRemaining - b.timeRemaining);

				const toDisplay = 3;

				const timers = list
					.slice(0, toDisplay)
					.map(item => `ch${item.channel}: ${formatTimeIcon(item.timeRemaining, delayRandMs)}`)
					.join(', ');

				return `⌚${timers}`;
			}

			/* Helper Functions */
			function updateAllTimers() {
				const children = timersContainer.getElementsByClassName('timer-container');

				for (let i = 0; i < children.length; i++) {
					updateTimer(children[i], i);
				}
			}

			function updateDocumentTitle() {
				document.title = formatDocumentTitle();
			}

			/* Initialize Content */
			ensureAllTimerContainers();
			updateDocumentTitle();

			/* Main Tick */
			function onTick() {
				updateAllTimers();
				updateDocumentTitle();
			}

			setInterval(onTick, 1000);

			/* Config */
			bossSelect.addEventListener('change', () => {
				appState.bossIndex = parseInt(bossSelect.value);
				updateDelayInputsDisabled();
				updateDelayInputsValue();

				if (appState.syncMode) {
					remotePressTimes.fill(null);

					subscribeToBoss(appState.bossIndex);
				}

				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			});

			function onDelayInputChanged() {
				const hours = clamp(parseInt(delayHoursInput.value), 0, 23);
				const minutes = clamp(parseInt(delayMinutesInput.value), 0, 59);
				appState.delayMinutes = hours * 60 + minutes;
				updateDelayInputsValue();
				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			}

			delayHoursInput.addEventListener('change', onDelayInputChanged);
			delayMinutesInput.addEventListener('change', onDelayInputChanged);

			/* Tools */
			function buildShareUrl() {
				return `${window.location.origin}${window.location.pathname}?${saveUrlParams()}`;
			}

			function copyShareUrl() {
				const url = buildShareUrl();

				navigator.clipboard.writeText(url).then(() => {
					const copyLinkButton = document.getElementById('copyLinkButton');
					const original = copyLinkButton.textContent;
					copyLinkButton.textContent = 'Copied!';
					setTimeout(() => { copyLinkButton.textContent = original; }, 1200);
				}).catch(err => {
					console.warn('Clipboard write failed:', err);
					copyLinkButton.textContent = 'Failed!';
					setTimeout(() => { copyLinkButton.textContent = original; }, 1200);
				});
			}

			document.getElementById('copyLinkButton').addEventListener('click', copyShareUrl);

			function formatPressTimes(pressTimes) {
				const bossDefition = getBossDefinition();
				const delayMinutes = bossDefition.delayMinutes;
				const formatLocalTime = appState.formatLocalTime;

				const delayMs = delayMinutes * 60 * 1000;

				const lines = [];

				for (let i = 0; i < CHANNELS_MAX; i++) {
					const pressTime = pressTimes[i];

					if (pressTime === null)
						continue;

					const hh = formatLocalTime ? String(pressTime.getHours()).padStart(2, '0') : 'xx';
					const mm = String(pressTime.getMinutes()).padStart(2, '0');

					lines.push(`ch${i + 1}: ${hh}:${mm}`);
				}

				return lines.join('\n');
			}

			function timersToClipboard() {
				const pressTimes = (appState.syncMode ? remotePressTimes : getBossState().pressTimes);

				const text = formatPressTimes(pressTimes);

				navigator.clipboard.writeText(text).then(() => {
					const original = copyTimersButton.textContent;
					copyTimersButton.textContent = 'Copied!';
					setTimeout(() => { copyTimersButton.textContent = original; }, 1200);
				}).catch(err => {
					console.warn('Clipboard write failed:', err);
					copyTimersButton.textContent = 'Failed!';
					setTimeout(() => { copyTimersButton.textContent = original; }, 1200);
				});
			}

			document.getElementById('copyTimersButton').addEventListener('click', timersToClipboard);

			// TODO: To Clipboard?

			document.getElementById('clearTimersButton').addEventListener('click', () => {
				for (let i = 0; i < CHANNELS_MAX; i++)
					setPressTime(i, null);

				updateAllTimers();
				updateDocumentTitle();
			});

			/* Theme Toggle */
			const THEME_KEY = 'mapleBossTracker.theme';
			const themeToggleButton = document.getElementById('themeToggleButton');

			function applyThemeButtonLabel() {
				const isLight = document.documentElement.getAttribute('data-theme') === 'light';

				themeToggleButton.textContent = isLight ? '☾' : '☀';
			}

			function toggleTheme() {
				const isLight = document.documentElement.getAttribute('data-theme') === 'light';

				if (isLight) {
					document.documentElement.removeAttribute('data-theme');
					localStorage.setItem(THEME_KEY, 'dark');
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					localStorage.setItem(THEME_KEY, 'light');
				}

				applyThemeButtonLabel();
			}

			themeToggleButton.addEventListener('click', toggleTheme);

			applyThemeButtonLabel();

			/* Options Menu */
			const optionsToggleButton = document.getElementById('optionsToggleButton');
			const optionsMenu = document.getElementById('optionsMenu');

			function closeOptionsMenu() {
				optionsMenu.hidden = true;
				optionsToggleButton.setAttribute('aria-expanded', 'false');
			}

			optionsToggleButton.addEventListener('click', (e) => {
				e.stopPropagation();
				const isOpen = !optionsMenu.hidden;
				optionsMenu.hidden = isOpen;
				optionsToggleButton.setAttribute('aria-expanded', String(!isOpen));
			});

			document.addEventListener('click', (e) => {
				if (!optionsMenu.hidden && !optionsMenu.contains(e.target) && e.target !== optionsToggleButton) {
					closeOptionsMenu();
				}
			});

			optionsMenu.addEventListener('click', (e) => e.stopPropagation());

			channelsInput.addEventListener('input', () => {
				appState.channels = clamp(parseInt(channelsInput.value), CHANNELS_MIN, CHANNELS_MAX);
				channelsInput.value = appState.channels;
				ensureAllTimerContainers();
				saveAppState();
			});

			delayRandPercInput.addEventListener('change', () => {
				appState.delayRandPerc = clamp(parseInt(delayRandPercInput.value), 0, 100);
				delayRandPercInput.value = appState.delayRandPerc;
				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			});

			formatLocalTimeCheckbox.addEventListener('change', () => {
				appState.formatLocalTime = formatLocalTimeCheckbox.checked;
				saveAppState();
			});

			syncModeCheckbox.addEventListener('change', () => {
				appState.syncMode = syncModeCheckbox.checked;

				if (appState.syncMode) {
					remotePressTimes.fill(null);

					if (window.__firebase) {
						const newRoom = (appState.roomId === null);

						if (newRoom)
							appState.roomId = crypto.randomUUID();

						subscribeToBoss(appState.bossIndex);

						if (newRoom) {
							for (let i = 0; i < bossDefinitionsCount && i < appState.bossStates.length; i++)
								writeAllPressTimesToFirestore(i, appState.bossStates[i].pressTimes);
						}
					} else {
						// TODO: Firebase isn't ready?
					}
				} else if (unsubscribeFromBoss) {
					unsubscribeFromBoss();
					unsubscribeFromBoss = null;
				}

				saveAppState();
			});
		</script>
	</div>
