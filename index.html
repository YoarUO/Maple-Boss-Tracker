<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maple Boss Tracker</title>
	<script>
		const THEME_KEY = 'mapleBossTracker.theme';
		const DEFAULT_ICON = '🍁';

		class themeDefinition {
			constructor(name, icon, overridesDocumentIcon) {
				this.name = name;
				this.icon = icon;
				this.overridesDocumentIcon = overridesDocumentIcon;
			}
		}

		const themeDefinitions = [
			new themeDefinition('light', '☀️', false),
			new themeDefinition('dark', '🌙', false),
			new themeDefinition('autumn', '🍂', true),
			new themeDefinition('desert', '🌵', true),
			new themeDefinition('aqua', '🐠', true),
			new themeDefinition('forest', '🌳', true)
		];

		function findThemeIndex(themeName) {
			let themeIndex = -1;

			for (let i = 0; themeIndex == -1 && i < themeDefinitions.length; i++) {
				if (themeDefinitions[i].name == themeName)
					themeIndex = i;
			}

			return themeIndex;
		}

		function setFaviconIcon(icon) {
			const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${icon}</text></svg>`;

			let link = document.querySelector("link[rel~='icon']");

			if (!link) {
				link = document.createElement('link');
				link.rel = 'icon';
				document.head.appendChild(link);
			}

			link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
		}

		function setTheme(themeDefinition) {
			document.documentElement.setAttribute('data-theme', themeDefinition.name);

			const themeToggleButton = document.getElementById('themeToggleButton');

			const icon = themeDefinition.icon;
			//const icon = getNextThemeIcon(themeDefinitions.indexOf(themeDefinition));

			if (themeToggleButton)
				themeToggleButton.textContent = icon;

			setFaviconIcon(themeDefinition.overridesDocumentIcon ? icon : DEFAULT_ICON);
		}

		if (themeDefinitions.length != 0) {
			const themeName = localStorage.getItem(THEME_KEY); // TODO: Move to AppState?

			let themeIndex = findThemeIndex(themeName);

			if (themeIndex == -1)
				themeIndex = 0;

			setTheme(themeDefinitions[themeIndex]);
		}
	</script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

		:root {
			--bg-void: #0a0c0f;
			--bg-panel: #12151a;
			--bg-card: #171b21;
			--bg-input: #0d1015;
			--hairline: #262b33;
			--hairline-soft: #1c2028;
			--text-primary: #e6e8eb;
			--text-secondary: #8b93a1;
			--text-muted: #5b6472;
			--maple-gold: #e3b341;
			--maple-gold-dim: #8a6a24;
			--warning-orange: #f59e0b;
			--warning-glow: rgba(245, 158, 11, 0.18);
			--success-green: #4fd97b;
			--success-glow: rgba(79, 217, 123, 0.18);
			--danger-red: #DC3545;
			--danger-glow: rgba(220, 53, 69, 0.18);
			--font-display: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			--font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
			--bg-button: #1d222a;
			--bg-button-hover: #262c36;
			--clear-hover-bg: #2a1518;
			--clear-hover-border: #b6413a;
			--clear-hover-text: #f28b82;
		}

		[data-theme="light"] {
			--bg-void: #f4f5f7;
			--bg-panel: #ffffff;
			--bg-card: #fbfbfc;
			--bg-input: #ffffff;
			--hairline: #d8dce2;
			--hairline-soft: #e4e7eb;
			--text-primary: #1c2028;
			--text-secondary: #4b5563;
			--text-muted: #8b93a1;
			--maple-gold: #b8860f;
			--maple-gold-dim: #d9b45c;
			--warning-orange: #c2740a;
			--warning-glow: rgba(194, 116, 10, 0.14);
			--success-green: #1f9d54;
			--success-glow: rgba(31, 157, 84, 0.14);
			--danger-red: #c22b3a;
			--danger-glow: rgba(194, 43, 58, 0.14);
			--bg-button: #ffffff;
			--bg-button-hover: #eef0f3;
			--clear-hover-bg: #fbe9ea;
			--clear-hover-border: #d9757e;
			--clear-hover-text: #b0303f;
		}

		[data-theme="autumn"] {
			--bg-void: #1a120b;
			--bg-panel: #241811;
			--bg-card: #2b1d14;
			--bg-input: #1f150e;
			--hairline: #4a3222;
			--hairline-soft: #3a2818;
			--text-primary: #f5e6d3;
			--text-secondary: #cba883;
			--text-muted: #8a6c52;
			--maple-gold: #e08a3c;
			--maple-gold-dim: #a8672a;
			--warning-orange: #ff8c42;
			--warning-glow: rgba(255, 140, 66, 0.18);
			--success-green: #8bbf5a;
			--success-glow: rgba(139, 191, 90, 0.18);
			--danger-red: #c1440e;
			--danger-glow: rgba(193, 68, 14, 0.18);
			--bg-button: #2f2016;
			--bg-button-hover: #3d2a1a;
			--clear-hover-bg: #3a1810;
			--clear-hover-border: #b6413a;
			--clear-hover-text: #f28b82;
		}

		[data-theme="autumn"] body {
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224, 138, 60, 0.08), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(193, 68, 14, 0.06), transparent);
		}

		[data-theme="desert"] {
			--bg-void: #1f160c;
			--bg-panel: #2a1e11;
			--bg-card: #332615;
			--bg-input: #241a0f;
			--hairline: #55442a;
			--hairline-soft: #423320;
			--text-primary: #f3e4c8;
			--text-secondary: #cbab7c;
			--text-muted: #9c8158;
			--maple-gold: #e0a33c;
			--maple-gold-dim: #a87a2a;
			--warning-orange: #ff9d42;
			--warning-glow: rgba(255, 157, 66, 0.18);
			--success-green: #a3b85a;
			--success-glow: rgba(163, 184, 90, 0.18);
			--danger-red: #c1590e;
			--danger-glow: rgba(193, 89, 14, 0.18);
			--bg-button: #362715;
			--bg-button-hover: #45331c;
			--clear-hover-bg: #3a2110;
			--clear-hover-border: #b6633a;
			--clear-hover-text: #f2b28b;
		}

		[data-theme="desert"] body {
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224, 163, 60, 0.10), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(193, 89, 14, 0.06), transparent);
		}

		[data-theme="aqua"] {
			--bg-void: #061a22;
			--bg-panel: #0b2530;
			--bg-card: #0f2e3b;
			--bg-input: #081e27;
			--hairline: #1c4a5a;
			--hairline-soft: #163b48;
			--text-primary: #dff3f7;
			--text-secondary: #8fc4d4;
			--text-muted: #5d94a5;
			--maple-gold: #3fc7d9;
			--maple-gold-dim: #2a8a99;
			--warning-orange: #f0a63e;
			--warning-glow: rgba(240, 166, 62, 0.18);
			--success-green: #4fd9a5;
			--success-glow: rgba(79, 217, 165, 0.18);
			--danger-red: #e0505a;
			--danger-glow: rgba(224, 80, 90, 0.18);
			--bg-button: #103544;
			--bg-button-hover: #16465a;
			--clear-hover-bg: #1a2f3a;
			--clear-hover-border: #b6413a;
			--clear-hover-text: #f28b82;
		}

		[data-theme="aqua"] body {
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(63, 199, 217, 0.10), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79, 217, 165, 0.06), transparent);
		}

		[data-theme="forest"] {
			--bg-void: #0d1710;
			--bg-panel: #142016;
			--bg-card: #18271a;
			--bg-input: #101a12;
			--hairline: #2c4230;
			--hairline-soft: #223526;
			--text-primary: #e3ecdf;
			--text-secondary: #9db89a;
			--text-muted: #647f65;
			--maple-gold: #e3b341;
			--maple-gold-dim: #8a6a24;
			--warning-orange: #d9a441;
			--warning-glow: rgba(217, 164, 65, 0.18);
			--success-green: #52c97a;
			--success-glow: rgba(82, 201, 122, 0.18);
			--danger-red: #c1502e;
			--danger-glow: rgba(193, 80, 46, 0.18);
			--bg-button: #1c2e1f;
			--bg-button-hover: #263c29;
			--clear-hover-bg: #2a1a12;
			--clear-hover-border: #b6633a;
			--clear-hover-text: #f2b28b;
		}

		[data-theme="forest"] body {
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(111, 191, 94, 0.08), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(82, 201, 122, 0.06), transparent);
		}

		* {
			box-sizing: border-box;
		}

		body {
			background-color: var(--bg-void);
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227, 179, 65, 0.05), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79, 217, 123, 0.04), transparent);
			color: var(--text-primary);
			font-family: var(--font-display);
			margin: 0;
			padding: 32px 24px 64px;
			transition: background-color 0.2s ease, color 0.2s ease;
		}

		.header-container {
			max-width: 1160px;
			margin: 0 auto 28px;
			padding: 0 4px;
			display: flex;
			align-items: baseline;
			gap: 14px;
		}

		.maple-mark {
			width: 26px;
			height: 26px;
			flex-shrink: 0;
			color: var(--maple-gold);
			transform: translateY(3px);
		}

		.page-title {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: -0.02em;
			color: var(--text-primary);
			margin: 0;
		}

		.page-credits {
			font-size: 13px;
			color: var(--text-muted);
			margin: 0;
			font-weight: 500;
		}

		.page-credits::before {
			content: "— ";
		}

		.page-frame {
			max-width: 1160px;
			margin: 0 auto;
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			box-sizing: border-box;
			padding: 28px 28px 32px;
			width: 100%;
			border-radius: 10px;
		}

		.config-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-bottom: 22px;
			margin-bottom: 22px;
			border-bottom: 1px solid var(--hairline);
		}

		.tools-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-top: 22px;
			margin-top: 22px;
			border-top: 1px solid var(--hairline);
		}

		.form-group {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0;
		}

		label.main-label {
			font-weight: 700;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--text-secondary);
			min-width: unset;
		}

		input,
		select {
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 5px;
			color: var(--text-primary);
			font-family: var(--font-mono);
			font-size: 14px;
			padding: 6px 8px;
			transition: border-color 0.15s ease;
		}

		input:focus {
			outline: none;
			border-color: var(--maple-gold-dim);
		}

		input:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.input-channels,
		.input-time,
		.input-random {
			width: 56px;
			text-align: center;
		}

		input:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.time-unit-label {
			font-size: 13px;
			color: var(--text-muted);
			margin-right: 6px;
		}

		input[type="time"]::-webkit-calendar-picker-indicator {
			filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			-webkit-filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			opacity: 0.8;
		}

		#timerContainer {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
			gap: 14px;
		}

		.timer-container {
			background-color: var(--bg-card);
			border: 1px solid var(--hairline-soft);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 16px;
			width: auto;
			transition: border-color 0.2s ease;
		}

		.timer-container.is-soon {
			border-color: var(--warning-orange);
			box-shadow: 0 0 0 1px var(--warning-glow), 0 0 24px -6px var(--warning-glow);
		}

		.timer-container.is-soon span {
			color: var(--warning-orange);
		}

		.timer-container.is-ready {
			border-color: var(--success-green);
			box-shadow: 0 0 0 1px var(--success-glow), 0 0 24px -6px var(--success-glow);
		}

		.timer-container.is-ready span {
			color: var(--success-green);
		}

		.timer-container.is-spawned {
			border-color: var(--danger-red);
			box-shadow: 0 0 0 1px var(--danger-glow), 0 0 24px -6px var(--danger-glow);
		}

		.timer-container.is-spawned span {
			color: var(--danger-red);
		}

		.timer-container .row-top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		button {
			background-color: var(--bg-button);
			border: 1px solid var(--hairline);
			border-radius: 6px;
			color: var(--text-primary);
			cursor: pointer;
			font-family: var(--font-display);
			font-size: 13px;
			font-weight: 700;
			min-width: unset;
			padding: 8px 14px;
			transition: all 0.15s ease-in-out;
		}

		button:hover {
			background-color: var(--bg-button-hover);
			border-color: var(--maple-gold-dim);
			color: var(--maple-gold);
		}

		button:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-group {
			gap: 8px;
		}

		.styled-checkbox {
			appearance: none;
			-webkit-appearance: none;
			width: 16px;
			height: 16px;
			margin: 0;
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 4px;
			cursor: pointer;
			position: relative;
			transition: all 0.15s ease-in-out;
		}

		.styled-checkbox:hover {
			border-color: var(--maple-gold-dim);
		}

		.styled-checkbox:checked {
			background-color: var(--maple-gold);
			border-color: var(--maple-gold);
		}

		.styled-checkbox:checked::after {
			content: '';
			position: absolute;
			left: 4px;
			top: 1px;
			width: 4px;
			height: 8px;
			border: solid var(--bg-void);
			border-width: 0 2px 2px 0;
			transform: rotate(45deg);
		}

		.styled-checkbox:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-label {
			font-size: 13px;
			color: var(--text-secondary);
			cursor: pointer;
			user-select: none;
		}

		.record-input {
			width: 100%;
		}

		.respawn-label {
			font-size: 13px;
			font-weight: 600;
			color: var(--text-secondary);
			min-width: unset;
		}

		.range-label {
			font-size: 12px;
			font-weight: 500;
			color: var(--text-muted);
			font-family: var(--font-mono);
			min-width: unset;
		}

		.countdown-label {
			font-family: var(--font-mono);
			font-size: 20px;
			color: var(--maple-gold);
			font-weight: 700;
			min-width: unset;
			letter-spacing: 0.01em;
		}

		.history-btn {
			margin-left: auto;
		}

		.history-btn,
		.qmark-btn,
		.clear-btn {
			background: transparent;
			border-color: var(--hairline-soft);
			color: var(--text-muted);
			font-size: 12px;
			padding: 5px 8px;
		}

		.clear-btn:hover {
			background-color: var(--clear-hover-bg);
			border-color: var(--clear-hover-border);
			color: var(--clear-hover-text);
		}

		.qmark-btn.active,
		.qmark-btn.active:hover {
			background-color: var(--maple-gold);
			border-color: var(--maple-gold);
			color: var(--bg-void);
		}

		@media (max-width: 560px) {
			.page-frame {
				padding: 20px 16px;
				border-radius: 0;
			}

			.config-row {
				gap: 14px;
			}

			.tools-row {
				gap: 14px;
			}
		}

		.theme-toggle {
			margin-left: auto;
			display: flex;
			align-items: center;
			align-self: center;
		}

		.options-menu-wrapper {
			position: relative;
			display: flex;
			align-items: center;
			align-self: center;
			margin-left: 12px;
		}

		.options-menu {
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			gap: 14px;
			min-width: 200px;
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			border-radius: 8px;
			padding: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
		}

		.options-menu[hidden] {
			display: none;
		}

		.options-menu .form-group {
			justify-content: space-between;
		}

		.history-dialog {
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			border-radius: 10px;
			color: var(--text-primary);
			font-family: var(--font-display);
			padding: 18px 20px;
			width: min(320px, calc(100vw - 48px));
		}

		.history-dialog::backdrop {
			background: rgba(0, 0, 0, 0.5);
		}

		.history-dialog-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 12px;
		}

		.history-dialog-title {
			font-size: 15px;
			font-weight: 700;
			color: var(--maple-gold);
		}

		.history-dialog-close {
			background: transparent;
			border: none;
			color: var(--text-muted);
			font-size: 18px;
			line-height: 1;
			padding: 2px 6px;
		}

		.history-dialog-close:hover {
			background: transparent;
			border: none;
			color: var(--maple-gold);
		}

		.history-dialog-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.history-dialog-list li {
			font-family: var(--font-mono);
			font-size: 13px;
			color: var(--text-secondary);
			border-bottom: 1px solid var(--hairline-soft);
			padding-bottom: 6px;
		}

		.history-dialog-list li:last-child {
			border-bottom: none;
			padding-bottom: 0;
		}

		.history-empty {
			font-size: 13px;
			color: var(--text-muted);
		}

		.form-group[hidden] {
			display: none;
		}
	</style>
</head>

<body>
	<div class="header-container">

		<script>
			/* Configurations */
			const CHANNELS_MIN = 1;
			const CHANNELS_MAX = 12;
			const CHANNELS_DEFAULT = 6;
			const DELAY_RAND_PERC_DEFAULT = 10;
			const APPSTATE_KEY = 'mapleBossTracker.appState';

			/* Get Element Handles */
			const groupSelect = document.getElementById('groupSelect');
			const bossSelect = document.getElementById('bossSelect');
			const delayHoursInput = document.getElementById('delayHoursInput');
			const delayMinutesInput = document.getElementById('delayMinutesInput');
			const favoriteGroup = document.getElementById('favoriteGroup');
			const favoriteCheckbox = document.getElementById('favoriteCheckbox');
			const channelsInput = document.getElementById('channelsInput');
			const delayRandPercInput = document.getElementById('delayRandPercInput');
			const timersContainer = document.getElementById('timerContainer');
			const formatLocalTimeCheckbox = document.getElementById('formatLocalTimeCheckbox');
			const syncModeCheckbox = document.getElementById('syncModeCheckbox');
			const historyDialog = document.getElementById('historyDialog');
			const historyDialogTitle = document.getElementById('historyDialogTitle');
			const historyDialogClose = document.getElementById('historyDialogClose');
			const historyDialogList = document.getElementById('historyDialogList');

			/* Boss Definitions */
			class GroupDefinition {
				constructor(groupIndex, name, bossDefinitions) {
					this.groupIndex = groupIndex;
					this.name = name;
					this.bossDefinitions = bossDefinitions;
				}
			}

			class BossDefinition {
				constructor(bossIndex, name, delayMinutes) {
					this.bossIndex = bossIndex;
					this.name = name;
					this.delayMinutes = delayMinutes;
				}
			}

			const bossTable = [
				new GroupDefinition(0, 'Favorites', [
					new BossDefinition(0, 'Custom', 60),
				]),
				new GroupDefinition(1, 'Victoria Island', [
					new BossDefinition(8, 'Mano', 60),
					new BossDefinition(9, 'Stumpy', 60),
					new BossDefinition(10, 'Faust', 120),
					new BossDefinition(11, 'King Clang', 120),
					new BossDefinition(12, 'Mushmom', 120),
					new BossDefinition(13, 'Dyle', 120),
					new BossDefinition(14, 'Zombie Mushmom', 120),
					new BossDefinition(15, 'Jr. Balrog', 180)
				]),
				new GroupDefinition(2, 'Elnath Mts.', [
					new BossDefinition(20, 'Eliza', 180),
					new BossDefinition(21, 'Snowman', 180)
				]),
				new GroupDefinition(3, 'Ludus Lake', [
					new BossDefinition(5, 'Timer', 120),
					new BossDefinition(16, 'Zeno', 120),
					new BossDefinition(17, 'Old Fox', 180)
				]),
				new GroupDefinition(4, 'Aqua Road', [
					new BossDefinition(2, 'Seruf', 60)
				]),
				new GroupDefinition(5, 'Nihal Desert', [
					new BossDefinition(1, 'Deo', 60),
					new BossDefinition(6, 'Kimera', 180)
				]),
				new GroupDefinition(6, 'Minar Forest', [
					new BossDefinition(3, 'Manon', 90),
					new BossDefinition(7, 'Griffey', 90),
					new BossDefinition(4, 'Leviathan', 240)
				]),
				new GroupDefinition(7, 'Mu Lung Garden', [
					new BossDefinition(18, 'Tae Roon', 180),
					new BossDefinition(19, 'King Sage Cat', 180)
				]),
				new GroupDefinition(8, 'Zipangu', [
					new BossDefinition(22, 'Blue Mushmom', 240),
					new BossDefinition(23, 'Female Boss', 240),
					new BossDefinition(24, 'Kacchuu Musha', 360)
				]),
				new GroupDefinition(9, 'Temple of Time', [
					new BossDefinition(25, 'Dodo', 240),
					new BossDefinition(26, 'Lilynouch', 240),
					new BossDefinition(27, 'Lyka', 240)
				])
			];

			const bossDefinitionsCount = 28; // Note: Hardcoded

			const bossDefinitions = Array(bossDefinitionsCount);

			for (let i = 0; i < bossTable.length; i++) {
				const bossGroup = bossTable[i];

				for (let j = 0; j < bossGroup.bossDefinitions.length; j++) {
					const bossDefinition = bossGroup.bossDefinitions[j];

					if (bossDefinition.bossIndex >= 0 && bossDefinition.bossIndex < bossDefinitionsCount)
						bossDefinitions[bossDefinition.bossIndex] = bossDefinition;
				}
			}

			function getGroupDefinition(groupIndex) {
				// TODO: Index groupDefinitions array?
				for (let i = 0; i < bossTable.length; i++) {
					const groupDefinition = bossTable[i];

					if (groupDefinition.groupIndex == groupIndex)
						return groupDefinition;
				}

				return null;
			}

			function getBossDefinition() { // TODO: Pass bossIndex?
				// Return default definition
				if (appState.bossIndex == 0) {
					const bossDefinition = bossDefinitions[0];

					bossDefinition.delayMinutes = appState.delayMinutes;

					return bossDefinition;
				}

				if (appState.bossIndex > 0 && appState.bossIndex < bossDefinitionsCount)
					return bossDefinitions[appState.bossIndex];

				return null;
			}

			for (let i = 0; i < bossTable.length; i++) {
				const groupDefinition = bossTable[i];
				const option = document.createElement('option');
				option.value = groupDefinition.groupIndex;
				option.textContent = groupDefinition.name;
				groupSelect.appendChild(option);
			}

			function addBossOption(bossDefinition) {
				const option = document.createElement('option');
				option.value = bossDefinition.bossIndex;
				option.textContent = bossDefinition.name;
				bossSelect.appendChild(option);
			}

			function populateBossSelect(groupIndex) {
				bossSelect.textContent = '';

				if (groupIndex == 0) {
					addBossOption(bossDefinitions[0]);

					for (let i = 0; i < appState.favorites.length; i++) {
						const bossIndex = appState.favorites[i];

						if (bossIndex > 0 && bossIndex < bossDefinitions.length)
							addBossOption(bossDefinitions[bossIndex]);
					}

					return;
				}

				const groupDefinition = getGroupDefinition(groupIndex);

				if (groupDefinition === null)
					return;

				for (let i = 0; i < groupDefinition.bossDefinitions.length; i++)
					addBossOption(groupDefinition.bossDefinitions[i]);
			}

			function getGroupIndex(bossIndex) {
				if (appState.viewingFavorites && appState.favorites.includes(bossIndex))
					return 0;

				for (let i = 0; i < bossTable.length; i++) {
					const groupDefinition = bossTable[i];

					for (let j = 0; j < groupDefinition.bossDefinitions.length; j++) {
						const bossDefinition = groupDefinition.bossDefinitions[j];

						if (bossDefinition.bossIndex == bossIndex)
							return groupDefinition.groupIndex;
					}
				}

				return 0;
			}

			function isBossFavorited(bossIndex) {
				return (bossIndex == 0 || appState.favorites.includes(bossIndex));
			}

			function updateFavoriteCheckbox() {
				favoriteGroup.hidden = (appState.bossIndex == 0);
				favoriteCheckbox.checked = isBossFavorited(appState.bossIndex);
			}

			/* AppState */
			const MAX_HISTORY_SIZE = 5;

			class HistoryList {
				constructor() {
					this.items = [];
				}

				get() {
					return this.items;
				}

				add(record) {
					this.items.unshift(record);
					if (this.items.length > MAX_HISTORY_SIZE)
						this.items.pop();
				}

				toJSON() {
					return this.items.map(date => date === null ? null : date.toISOString());
				}

				fromJSON(json) {
					this.items = (json || []).map(value => value === null ? null : new Date(value));
				}

				toFirestore() {
					return this.items;
				}

				fromFirestore(data) {
					this.items = (data || []).map(value => value === null ? null : (value.toDate ? value.toDate() : new Date(value)));
				}

				copy(history) {
					this.items = history.get().slice();
				}

				clear() {
					this.items.length = 0;
				}
			}

			class BossEntry {
				constructor() {
					this.pressTime = null;
					this.qmark = false;
					this.history = new HistoryList();
				}

				toJSON() {
					return {
						pressTime: this.pressTime === null ? null : this.pressTime.toISOString(),
						qmark: Boolean(this.qmark),
						history: this.history.toJSON()
					};
				}

				fromJSON(json) {
					if ('pressTime' in json)
						this.pressTime = (json.pressTime === null ? null : new Date(json.pressTime));

					if ('qmark' in json)
						this.qmark = (json.qmark === null ? false : Boolean(json.qmark));

					if ('history' in json)
						this.history.fromJSON(json.history);
				}

				toFirestore() {
					return {
						pressTime: this.pressTime,
						qmark: Boolean(this.qmark),
						history: this.history.toFirestore()
					};
				}

				fromFirestore(data) {
					if ('pressTime' in data)
						this.pressTime = (data.pressTime === null ? null : (data.pressTime.toDate ? data.pressTime.toDate() : new Date(data.pressTime)));

					if ('qmark' in data)
						this.qmark = (data.qmark === null ? false : Boolean(data.qmark));

					if ('history' in data)
						this.history.fromFirestore(data.history);
				}

				copy(bossEntry) {
					this.pressTime = bossEntry.pressTime;
					this.qmark = bossEntry.qmark;
					this.history.copy(bossEntry.history);
				}

				clear() {
					this.pressTime = null;
					this.qmark = false;
					this.history.clear();
				}
			}

			class BossState {
				constructor() {
					this.bossEntries = new Array(CHANNELS_MAX);

					for (let i = 0; i < this.bossEntries.length; i++)
						this.bossEntries[i] = new BossEntry();
				}

				toJSON() {
					return {
						bossEntries: this.bossEntries.map(entry => entry.toJSON()),
					};
				}

				fromJSON(json) {
					if ('bossEntries' in json) {
						for (let i = 0; i < this.bossEntries.length && i < json.bossEntries.length; i++)
							this.bossEntries[i].fromJSON(json.bossEntries[i]);
					}

					// Legacy
					if ('pressTimes' in json) {
						for (let i = 0; i < this.bossEntries.length && i < json.pressTimes.length; i++)
							this.bossEntries[i].pressTime = (json.pressTimes[i] === null ? null : new Date(json.pressTimes[i]));
					}
				}

				toFirestore() {
					return {
						bossEntries: this.bossEntries.map(entry => entry.toFirestore()),
					};
				}

				fromFirestore(data) {
					if ('bossEntries' in data) {
						for (let i = 0; i < this.bossEntries.length && i < data.bossEntries.length; i++)
							this.bossEntries[i].fromFirestore(data.bossEntries[i]);
					}
				}

				copy(bossState) {
					for (let i = 0; i < this.bossEntries.length && i < bossState.bossEntries.length; i++)
						this.bossEntries[i].copy(bossState.bossEntries[i]);
				}

				clear() {
					this.bossEntries.forEach(bossEntry => bossEntry.clear());
				}
			}

			class AppState {
				constructor() {
					this.channels = CHANNELS_DEFAULT;
					this.delayRandPerc = DELAY_RAND_PERC_DEFAULT;
					this.formatLocalTime = false;
					this.syncMode = false;
					this.roomId = null;
					this.bossIndex = 0;
					this.delayMinutes = 60;
					this.bossStates = new Array(bossDefinitionsCount);

					for (let i = 0; i < this.bossStates.length; i++)
						this.bossStates[i] = new BossState();

					this.viewingFavorites = false;
					this.favorites = [];
				}

				toJSON() {
					return {
						channels: this.channels,
						delayRandPerc: this.delayRandPerc,
						formatLocalTime: this.formatLocalTime,
						syncMode: this.syncMode,
						roomId: this.roomId,
						bossIndex: this.bossIndex,
						delayMinutes: this.delayMinutes,
						bossStates: this.bossStates.map(state => state.toJSON()),
						viewingFavorites: this.viewingFavorites,
						favorites: this.favorites
					};
				}

				fromJSON(json) {
					if ('channels' in json)
						this.channels = json.channels;

					if ('delayRandPerc' in json)
						this.delayRandPerc = json.delayRandPerc;

					if ('formatLocalTime' in json)
						this.formatLocalTime = json.formatLocalTime;

					// TODO: Do not save/load sync mode, and instead rely on links?
					if ('syncMode' in json) {
						this.syncMode = json.syncMode;

						// Only load roomId when we're in sync mode
						if ('roomId' in json)
							this.roomId = json.roomId;
					}

					if ('bossIndex' in json)
						this.bossIndex = json.bossIndex;

					if ('delayMinutes' in json)
						this.delayMinutes = json.delayMinutes;

					if ('bossStates' in json) {
						for (let i = 0; i < this.bossStates.length && i < json.bossStates.length; i++)
							this.bossStates[i].fromJSON(json.bossStates[i]);
					}

					if ('viewingFavorites' in json)
						this.viewingFavorites = json.viewingFavorites;

					if ('favorites' in json)
						this.favorites = Array.isArray(json.favorites) ? json.favorites : [];
				}
			}

			const appState = new AppState();
			const remoteBossState = new BossState();

			/* Local Storage */
			function saveAppState() {
				localStorage.setItem(APPSTATE_KEY, JSON.stringify(appState));
			}

			function loadAppState() {
				const json = localStorage.getItem(APPSTATE_KEY);

				if (json === null)
					return;

				appState.fromJSON(JSON.parse(json));
			}

			/* Firestore */
			let firestoreUnsubscribeHandler = null;

			function writeBossEntryToFirestore(roomId, bossIndex, channelIndex, bossEntry) {
				const db = window.__firebase.db;
				const doc = window.__firebase.doc;
				const setDoc = window.__firebase.setDoc;

				try {
					const docRef = doc(db, 'rooms', roomId, 'bosses', String(bossIndex), 'channels', String(channelIndex));

					setDoc(docRef, bossEntry.toFirestore());
				} catch (error) {
					console.error('Firestore write failed:', error);
				}
			}

			function writeBossStateToFirestore(roomId, bossIndex, bossState) {
				for (let i = 0; i < CHANNELS_MAX && i < bossState.bossEntries.length; i++)
					writeBossEntryToFirestore(roomId, bossIndex, i, bossState.bossEntries[i]);
			}

			function subscribeToFirestore(roomId, bossIndex, bossState) {
				if (firestoreUnsubscribeHandler)
					firestoreUnsubscribeHandler();

				const db = window.__firebase.db;
				const doc = window.__firebase.doc;
				const collection = window.__firebase.collection;
				const onSnapshot = window.__firebase.onSnapshot;

				const colRef = collection(db, 'rooms', roomId, 'bosses', String(bossIndex), 'channels');

				firestoreUnsubscribeHandler = onSnapshot(colRef, (colSnap) => {
					colSnap.forEach((docSnap) => {
						const channelIndex = parseInt(docSnap.id);

						if (channelIndex >= 0 && channelIndex < bossState.bossEntries.length)
							bossState.bossEntries[channelIndex].fromFirestore(docSnap.data());
					});
				}, (error) => {
					console.error('Firestore subscription failed:', error);
				});
			}

			function onFirebaseReady() {
				if (appState.syncMode && appState.roomId !== null)
					subscribeToFirestore(appState.roomId, appState.bossIndex, remoteBossState);
			}

			/* URL Params */
			function saveUrlParams() {
				const params = new URLSearchParams(window.location.search);

				params.set('boss', appState.bossIndex);

				if (appState.syncMode) {
					params.delete('pt');
					params.set('room', appState.roomId);
				} else {
					params.delete('room');

					const ptArray = Array(CHANNELS_MAX);

					if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length) {
						const bossState = appState.bossStates[appState.bossIndex];

						for (let i = 0; i < CHANNELS_MAX && i < bossState.bossEntries.length; i++)
							ptArray[i] = (bossState.bossEntries[i].pressTime === null ? '' : String(bossState.bossEntries[i].pressTime.getTime()));
					}

					params.set('pt', ptArray.join(','));
				}

				return params.toString();
			}

			function loadUrlParams() {
				const params = new URLSearchParams(window.location.search);
				const bossParam = params.get('boss');
				const ptParam = params.get('pt');
				const roomParam = params.get('room');

				if (bossParam) {
					const parsed = parseInt(params.get('boss'));
					appState.bossIndex = (isNaN(parsed) ? 0 : clamp(parsed, 0, bossDefinitionsCount - 1));
				}

				if (roomParam) {
					appState.syncMode = true;
					appState.roomId = roomParam;
				} else if (ptParam) {
					const ptArray = params.get('pt').split(',');

					if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length) {
						const bossState = appState.bossStates[appState.bossIndex];

						for (let i = 0; i < CHANNELS_MAX && i < bossState.bossEntries.length && i < ptArray.length; i++)
							bossState.bossEntries[i].pressTime = (ptArray[i] == '' ? null : new Date(Number(ptArray[i])));
					}
				}

				if (bossParam || ptParam || roomParam)
					history.replaceState(null, '', window.location.pathname);
			}

			/* State Getters, Setters */
			function getBossState() {
				if (appState.syncMode)
					return remoteBossState;

				if (appState.bossIndex >= 0 && appState.bossIndex < appState.bossStates.length)
					return appState.bossStates[appState.bossIndex];

				return null;
			}

			function getBossEntry(channelIndex) {
				const bossState = getBossState();

				if (bossState === null)
					return null;

				if (channelIndex >= 0 && channelIndex < bossState.bossEntries.length)
					return bossState.bossEntries[channelIndex];

				return null;
			}

			function setPressTime(channelIndex, pressTime) {
				const bossEntry = getBossEntry(channelIndex);

				if (bossEntry === null)
					return;

				if (bossEntry.pressTime !== null)
					bossEntry.history.add(bossEntry.pressTime);

				bossEntry.pressTime = pressTime;

				if (appState.syncMode)
					writeBossEntryToFirestore(appState.roomId, appState.bossIndex, channelIndex, bossEntry);
				else
					saveAppState();
			}

			function setQmark(channelIndex, qmark) {
				const bossEntry = getBossEntry(channelIndex);

				if (bossEntry === null)
					return;

				bossEntry.qmark = qmark;

				if (appState.syncMode)
					writeBossEntryToFirestore(appState.roomId, appState.bossIndex, channelIndex, bossEntry);
				else
					saveAppState();
			}

			const emptyHistoryDialogItem = document.createElement('li');
			emptyHistoryDialogItem.className = 'history-empty';
			emptyHistoryDialogItem.textContent = 'No history yet.';

			const historyDialogItems = Array(MAX_HISTORY_SIZE);

			for (let i = 0; i < MAX_HISTORY_SIZE; i++)
				historyDialogItems[i] = document.createElement('li');

			function showHistory(channelIndex) {
				const bossEntry = getBossEntry(channelIndex);
				const historyItems = (bossEntry === null ? [] : bossEntry.history.get());

				historyDialogTitle.textContent = `Channel ${channelIndex + 1} History`;
				historyDialogList.textContent = '';

				if (historyItems.length === 0) {
					historyDialogList.appendChild(emptyHistoryDialogItem);
				} else {
					for (let i = 0; i < MAX_HISTORY_SIZE && i < historyItems.length; i++) {
						const historyDialogItem = historyDialogItems[i];
						historyDialogItem.textContent = (historyItems[i] === null ? '—' : historyItems[i].toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}));
						historyDialogList.appendChild(historyDialogItem);
					}
				}

				historyDialog.showModal();
			}

			historyDialogClose.addEventListener('click', () => {
				historyDialog.close();
			});

			/* Load State */
			loadAppState();
			loadUrlParams();

			// TODO: Load firestore?

			// TODO: Move elsehwere...
			function updateDelayInputsDisabled() {
				const disabled = (appState.bossIndex != 0);
				delayHoursInput.disabled = disabled;
				delayMinutesInput.disabled = disabled;
			}

			function updateDelayInputsValue() {
				const delayMinutes = getBossDefinition().delayMinutes;
				delayHoursInput.value = Math.floor(delayMinutes / 60);
				delayMinutesInput.value = delayMinutes % 60;
			}

			/* Initialize Inputs */
			groupSelect.value = getGroupIndex(appState.bossIndex);
			populateBossSelect(groupSelect.value);
			bossSelect.value = appState.bossIndex;
			channelsInput.min = CHANNELS_MIN;
			channelsInput.max = CHANNELS_MAX;
			channelsInput.value = appState.channels;
			delayRandPercInput.value = appState.delayRandPerc;
			updateDelayInputsDisabled();
			updateDelayInputsValue();
			updateFavoriteCheckbox();
			formatLocalTimeCheckbox.checked = appState.formatLocalTime;
			syncModeCheckbox.checked = appState.syncMode;

			/* Utility Functions */
			function clamp(value, min, max) {
				return Math.min(Math.max(value, min), max);
			}

			function toggleClass(element, classNames, classIndex) {
				for (let i = 0; i < classNames.length; i++) {
					element.classList.toggle(classNames[i], classIndex == i);
				}
			}

			function formatTime(time) {
				const hours = Math.floor(time / (1000 * 60 * 60));
				const minutes = Math.floor((time % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((time % (1000 * 60)) / 1000);

				const mm = minutes.toString().padStart(2, '0');
				const ss = seconds.toString().padStart(2, '0');

				if (hours > 0)
					return `${hours}:${mm}:${ss}`;
				else
					return `${mm}:${ss}`;
			}

			function timeStringToDate(timeString) {
				const now = new Date();
				const year = now.getFullYear();
				const MM = String(now.getMonth() + 1).padStart(2, '0');
				const DD = String(now.getDate()).padStart(2, '0');
				const dateString = `${year}-${MM}-${DD}`;
				const dateTimeString = `${dateString}T${timeString}`;
				const date = new Date(dateTimeString);
				const halfDayMs = 43200000; // 24 * 60 * 60 * 1000 / 2;

				// If it's at least 12 hours in the future, assume the user meant yesterday
				if ((date.getTime() - now.getTime()) > halfDayMs)
					date.setDate(date.getDate() - 1);

				return date;
			}

			function formatTimeIcon(time, delayVariationMs) {
				if (time <= -2 * delayVariationMs)
					return '⚠️';
				else if (time <= 0)
					return '✔️';
				else
					return formatTime(time);
			}

			/* Main Functions */
			const COUNTDOWN_STAGES = ['is-soon', 'is-ready', 'is-spawned'];
			const SOON_THRESHOLD_MS = 300000;
			const DOCUMENT_TITLE = document.title;

			function updateTimer(timerContainer, channelIndex) {
				const bossEntry = getBossEntry(channelIndex);
				const pressTime = (bossEntry === null ? null : bossEntry.pressTime);

				const qmarkButton = timerContainer.querySelector(`#qmarkButton-${channelIndex}`);
				const recordInput = timerContainer.querySelector(`#recordInput-${channelIndex}`);
				const respawnAvgLabel = timerContainer.querySelector(`#respawnAvgLabel-${channelIndex}`);
				const respawnMinLabel = timerContainer.querySelector(`#respawnMinLabel-${channelIndex}`);
				const respawnMaxLabel = timerContainer.querySelector(`#respawnMaxLabel-${channelIndex}`);
				const countdownLabel = timerContainer.querySelector(`#countdownLabel-${channelIndex}`);

				if (bossEntry !== null && qmarkButton) {
					if (bossEntry.qmark) {
						qmarkButton.classList.add('active')
						qmarkButton.textContent = '?';
						qmarkButton.setAttribute('aria-pressed', 'true');
					} else {
						qmarkButton.classList.remove('active')
						qmarkButton.textContent = '✓';
						qmarkButton.setAttribute('aria-pressed', 'false');
					}
				}

				const recordInputFocused = (recordInput && document.activeElement === recordInput);

				if (pressTime === null || isNaN(pressTime)) {
					if (recordInput && !recordInputFocused)
						recordInput.value = '';

					if (respawnAvgLabel)
						respawnAvgLabel.textContent = '';

					if (respawnMinLabel)
						respawnMinLabel.textContent = '';

					if (respawnMaxLabel)
						respawnMaxLabel.textContent = '';

					if (countdownLabel)
						countdownLabel.textContent = '';

					toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
				}
				else {
					const bossDefition = getBossDefinition();
					const delayMinutes = bossDefition.delayMinutes;
					const delayRandPerc = appState.delayRandPerc;

					const delayMs = delayMinutes * 60 * 1000;
					const delayRandMs = delayRandPerc * delayMs / 100;
					const respawnAvgTime = new Date(pressTime.getTime() + delayMs);
					const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
					const respawnMaxTime = new Date(respawnAvgTime.getTime() + delayRandMs);
					const now = new Date();
					const timeRemaining = respawnMinTime.getTime() - now.getTime();

					if (recordInput && !recordInputFocused) {
						const hh = String(pressTime.getHours()).padStart(2, '0');
						const mm = String(pressTime.getMinutes()).padStart(2, '0');

						recordInput.value = `${hh}:${mm}`;
					}

					if (respawnAvgLabel)
						respawnAvgLabel.textContent = `Expected Respawn: ${respawnAvgTime.toLocaleTimeString(undefined, {timeStyle: 'short'})}`;

					if (respawnMinLabel)
						respawnMinLabel.textContent = `Min Respawn: ${respawnMinTime.toLocaleTimeString(undefined, {timeStyle: 'short'})}`;

					if (respawnMaxLabel)
						respawnMaxLabel.textContent = `Max Respawn: ${respawnMaxTime.toLocaleTimeString(undefined, {timeStyle: 'short'})}`;

					if (countdownLabel) {
						if (timeRemaining <= -2 * delayRandMs) {
							toggleClass(timerContainer, COUNTDOWN_STAGES, 2);
							countdownLabel.textContent = "Spawned!";
						} else if (timeRemaining <= 0) {
							toggleClass(timerContainer, COUNTDOWN_STAGES, 1);
							countdownLabel.textContent = "Ready!";
						} else {
							if (timeRemaining <= SOON_THRESHOLD_MS)
								toggleClass(timerContainer, COUNTDOWN_STAGES, 0);
							else
								toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
							countdownLabel.textContent = `Remaining: ${formatTime(timeRemaining)}`;
						}
					}
				}
			}

			function createTimerContainer(channelIndex) {
				const timerContainer = document.createElement('div');
				timerContainer.className = 'timer-container';

				const rowTop = document.createElement('div');
				rowTop.className = 'row-top';

				const recordButton = document.createElement('button');
				recordButton.textContent = `Channel ${channelIndex + 1}`;

				const historyButton = document.createElement('button');
				historyButton.id = `historyButton-${channelIndex}`;
				historyButton.textContent = '🕘';
				historyButton.className = 'history-btn';
				//historyButton.setAttribute('aria-label', 'History');
				//historyButton.setAttribute('title', 'History');

				const qmarkButton = document.createElement('button');
				qmarkButton.id = `qmarkButton-${channelIndex}`;
				qmarkButton.textContent = '✓';
				qmarkButton.className = 'qmark-btn';

				const clearButton = document.createElement('button');
				clearButton.textContent = '✕';
				clearButton.className = 'clear-btn';

				const recordInput = document.createElement('input');
				recordInput.id = `recordInput-${channelIndex}`;
				recordInput.className = "record-input"
				recordInput.type = "time";
				recordInput.min = "00:00"
				recordInput.max = "23:59"
				recordInput.step = "60"

				const countdownLabel = document.createElement('span');
				countdownLabel.id = `countdownLabel-${channelIndex}`;
				countdownLabel.className = 'countdown-label';

				const respawnAvgLabel = document.createElement('span');
				respawnAvgLabel.id = `respawnAvgLabel-${channelIndex}`;
				respawnAvgLabel.className = 'respawn-label';

				const respawnMinLabel = document.createElement('span');
				respawnMinLabel.id = `respawnMinLabel-${channelIndex}`;
				respawnMinLabel.className = 'range-label';

				const respawnMaxLabel = document.createElement('span');
				respawnMaxLabel.id = `respawnMaxLabel-${channelIndex}`;
				respawnMaxLabel.className = 'range-label';

				recordButton.addEventListener('click', () => {
					setPressTime(channelIndex, new Date());
					setQmark(channelIndex, false);
					updateTimer(timerContainer, channelIndex);
					updateDocumentTitle();
				});

				historyButton.addEventListener('click', () => {
					showHistory(channelIndex);
				});

				qmarkButton.addEventListener('click', () => {
					const isActive = qmarkButton.classList.toggle('active');
					qmarkButton.textContent = (isActive ? '?' : '✓');
					qmarkButton.setAttribute('aria-pressed', String(isActive));
					setQmark(channelIndex, isActive);
				});

				clearButton.addEventListener('click', () => {
					setPressTime(channelIndex, null);
					setQmark(channelIndex, false);
					updateTimer(timerContainer, channelIndex);
					updateDocumentTitle();
				});

				/*recordInput.addEventListener('change', (event) => {
					setPressTime(channelIndex, timeStringToDate(event.target.value));
					updateTimer(timerContainer, channelIndex);
					updateDocumentTitle();
				});*/

				function commitRecordInput() {
					setPressTime(channelIndex, timeStringToDate(recordInput.value));
					updateTimer(timerContainer, channelIndex);
					updateDocumentTitle();
				}

				recordInput.addEventListener('blur', () => {
					commitRecordInput();
				});

				recordInput.addEventListener('keydown', (event) => {
					if (event.key === 'Enter') {
						event.preventDefault();
						commitRecordInput();
						recordInput.blur();
					}
				});

				rowTop.appendChild(recordButton);
				rowTop.appendChild(historyButton);
				rowTop.appendChild(qmarkButton);
				rowTop.appendChild(clearButton);

				timerContainer.appendChild(rowTop);
				timerContainer.appendChild(recordInput);
				timerContainer.appendChild(countdownLabel);
				timerContainer.appendChild(respawnAvgLabel);
				timerContainer.appendChild(respawnMinLabel);
				timerContainer.appendChild(respawnMaxLabel);

				return timerContainer;
			}

			function ensureAllTimerContainers() {
				const channelCount = appState.channels;
				const currentCount = timersContainer.getElementsByClassName('timer-container').length;

				if (channelCount > currentCount) {
					for (let i = currentCount; i < channelCount; i++) {
						const timerContainer = createTimerContainer(i);

						timersContainer.appendChild(timerContainer);

						updateTimer(timerContainer, i);
					}
				} else if (channelCount < currentCount) {
					while (timersContainer.getElementsByClassName('timer-container').length > channelCount) {
						const lastRow = timersContainer.lastElementChild;

						timersContainer.removeChild(lastRow);
					}
				}
			}

			function formatDocumentTitle() {
				const bossDefition = getBossDefinition();
				const delayMinutes = bossDefition.delayMinutes;
				const delayRandPerc = appState.delayRandPerc;

				const delayMs = delayMinutes * 60 * 1000;
				const delayRandMs = delayRandPerc * delayMs / 100;

				const list = [];

				for (let i = 0; i < CHANNELS_MAX; i++) {
					const bossEntry = getBossEntry(i);
					const pressTime = (bossEntry === null ? null : bossEntry.pressTime);

					if (pressTime === null)
						continue;

					const respawnAvgTime = new Date(pressTime.getTime() + delayMs);
					const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
					const now = new Date();
					const timeRemaining = respawnMinTime.getTime() - now.getTime();

					list.push({channel: i + 1, timeRemaining: timeRemaining})
				}

				if (list.length == 0)
					return DOCUMENT_TITLE;

				list.sort((a, b) => a.timeRemaining - b.timeRemaining);

				const toDisplay = 3;

				return list
					.slice(0, toDisplay)
					.map((item) => `c${item.channel}-${formatTimeIcon(item.timeRemaining, delayRandMs)}`)
					.join('|');

				//return `⌚${timers}`;
			}

			/* Helper Functions */
			function updateAllTimers() {
				const children = timersContainer.getElementsByClassName('timer-container');

				for (let i = 0; i < children.length; i++) {
					updateTimer(children[i], i);
				}
			}

			function updateDocumentTitle() {
				document.title = formatDocumentTitle();
			}

			/* Initialize Content */
			ensureAllTimerContainers();
			updateDocumentTitle();

			/* Main Tick */
			function onTick() {
				updateAllTimers();
				updateDocumentTitle();
			}

			setInterval(onTick, 1000);

			/* Config */
			groupSelect.addEventListener('change', () => {
				populateBossSelect(groupSelect.value);

				appState.viewingFavorites = (parseInt(groupSelect.value) == 0);

				bossSelect.dispatchEvent(new Event('change'));
			});

			bossSelect.addEventListener('change', () => {
				appState.bossIndex = parseInt(bossSelect.value);
				updateDelayInputsDisabled();
				updateDelayInputsValue();
				updateFavoriteCheckbox();

				if (appState.syncMode) {
					remoteBossState.clear();
					subscribeToFirestore(appState.roomId, appState.bossIndex, remoteBossState);
				}

				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			});

			function onDelayInputChanged() {
				const hours = clamp(parseInt(delayHoursInput.value), 0, 23);
				const minutes = clamp(parseInt(delayMinutesInput.value), 0, 59);
				appState.delayMinutes = hours * 60 + minutes;
				updateDelayInputsValue();
				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			}

			delayHoursInput.addEventListener('change', onDelayInputChanged);
			delayMinutesInput.addEventListener('change', onDelayInputChanged);

			function toggleFavorite() {
				const bossIndex = appState.bossIndex;

				if (bossIndex == 0)
					return;

				const indexOf = appState.favorites.indexOf(bossIndex);

				if (indexOf == -1) {
					appState.favorites.push(bossIndex);
					appState.favorites.sort((a, b) => a - b);
				} else {
					appState.favorites.splice(indexOf, 1);

					if (parseInt(groupSelect.value) == 0) { // TODO: Add appState.viewingFavorites?
						populateBossSelect(0);
						bossSelect.value = 0;
						bossSelect.dispatchEvent(new Event('change'));
					}
				}

				saveAppState();
			}

			favoriteCheckbox.addEventListener('change', toggleFavorite);

			/* Tools */
			function buildShareUrl() {
				return `${window.location.origin}${window.location.pathname}?${saveUrlParams()}`;
			}

			function copyShareUrl() {
				const url = buildShareUrl();

				navigator.clipboard.writeText(url).then(() => {
					const copyLinkButton = document.getElementById('copyLinkButton');
					const original = copyLinkButton.textContent;
					copyLinkButton.textContent = 'Copied!';
					setTimeout(() => {copyLinkButton.textContent = original;}, 1200);
				}).catch((error) => {
					console.warn('Clipboard write failed:', error);
					copyLinkButton.textContent = 'Failed!';
					setTimeout(() => {copyLinkButton.textContent = original;}, 1200);
				});
			}

			document.getElementById('copyLinkButton').addEventListener('click', copyShareUrl);

			function timersToClipboard() {
				const bossState = getBossState();

				if (bossState === null)
					return;

				const formatLocalTime = appState.formatLocalTime;

				const lines = [];

				for (let i = 0; i < CHANNELS_MAX && i < bossState.bossEntries.length; i++) {
					const bossEntry = bossState.bossEntries[i];
					const pressTime = bossEntry.pressTime;

					if (pressTime === null)
						continue;

					const hh = formatLocalTime ? String(pressTime.getHours()).padStart(2, '0') : 'xx';
					const mm = String(pressTime.getMinutes()).padStart(2, '0');

					lines.push(`ch${i + 1}: ${hh}:${mm}`);
				}

				const text = lines.join('\n');

				navigator.clipboard.writeText(text).then(() => {
					const original = copyTimersButton.textContent;
					copyTimersButton.textContent = 'Copied!';
					setTimeout(() => {copyTimersButton.textContent = original;}, 1200);
				}).catch((error) => {
					console.warn('Clipboard write failed:', error);
					copyTimersButton.textContent = 'Failed!';
					setTimeout(() => {copyTimersButton.textContent = original;}, 1200);
				});
			}

			document.getElementById('copyTimersButton').addEventListener('click', timersToClipboard);

			document.getElementById('clearTimersButton').addEventListener('click', () => {
				const bossState = getBossState();

				if (bossState === null)
					return;

				bossState.clear();

				if (appState.syncMode)
					writeBossStateToFirestore(appState.roomId, appState.bossIndex, bossState);
				else
					saveAppState();

				updateAllTimers();
				updateDocumentTitle();
			});

			/* Theme Toggle */
			const themeToggleButton = document.getElementById('themeToggleButton');

			function toggleTheme() {
				if (themeDefinitions.length == 0)
					return;

				const themeName = document.documentElement.getAttribute('data-theme');

				let nextThemeIndex = findThemeIndex(themeName) + 1;

				if (nextThemeIndex >= themeDefinitions.length)
					nextThemeIndex = 0;

				const themeDefinition = themeDefinitions[nextThemeIndex];

				setTheme(themeDefinition);

				localStorage.setItem(THEME_KEY, themeDefinition.name);
			}

			themeToggleButton.addEventListener('click', toggleTheme);

			// Fix theme toggle button icon
			if (themeDefinitions.length != 0) {
				const themeName = document.documentElement.getAttribute('data-theme');

				let themeIndex = findThemeIndex(themeName);

				if (themeIndex == -1)
					themeIndex = 0;

				themeToggleButton.textContent = themeDefinitions[themeIndex].icon;
			}

			/* Options Menu */
			const optionsToggleButton = document.getElementById('optionsToggleButton');
			const optionsMenu = document.getElementById('optionsMenu');

			function closeOptionsMenu() {
				optionsMenu.hidden = true;
				optionsToggleButton.setAttribute('aria-expanded', 'false');
			}

			optionsToggleButton.addEventListener('click', (e) => {
				e.stopPropagation();
				const isOpen = !optionsMenu.hidden;
				optionsMenu.hidden = isOpen;
				optionsToggleButton.setAttribute('aria-expanded', String(!isOpen));
			});

			document.addEventListener('click', (e) => {
				if (!optionsMenu.hidden && !optionsMenu.contains(e.target) && e.target !== optionsToggleButton) {
					closeOptionsMenu();
				}
			});

			optionsMenu.addEventListener('click', (e) => e.stopPropagation());

			channelsInput.addEventListener('input', () => {
				appState.channels = clamp(parseInt(channelsInput.value), CHANNELS_MIN, CHANNELS_MAX);
				channelsInput.value = appState.channels;
				ensureAllTimerContainers();
				saveAppState();
			});

			delayRandPercInput.addEventListener('change', () => {
				appState.delayRandPerc = clamp(parseInt(delayRandPercInput.value), 0, 100);
				delayRandPercInput.value = appState.delayRandPerc;
				updateAllTimers();
				updateDocumentTitle();
				saveAppState();
			});

			formatLocalTimeCheckbox.addEventListener('change', () => {
				appState.formatLocalTime = formatLocalTimeCheckbox.checked;
				saveAppState();
			});

			syncModeCheckbox.addEventListener('change', () => {
				if (!window.__firebase) {
					syncModeCheckbox.checked = appState.syncMode;
					return;
				}

				appState.syncMode = syncModeCheckbox.checked;

				if (appState.syncMode) {
					remoteBossState.clear();

					if (appState.roomId === null) {
						appState.roomId = crypto.randomUUID();

						for (let i = 0; i < bossDefinitionsCount && i < appState.bossStates.length; i++) {
							if (i == appState.bossIndex)
								remoteBossState.copy(appState.bossStates[i]);

							writeBossStateToFirestore(appState.roomId, i, appState.bossStates[i]);
						}
					}

					subscribeToFirestore(appState.roomId, appState.bossIndex, remoteBossState);
				} else {
					if (firestoreUnsubscribeHandler)
						firestoreUnsubscribeHandler();
				}

				saveAppState();
			});
		</script>
	</div>
</body>

</html>
