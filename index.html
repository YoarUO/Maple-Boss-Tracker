<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maple Boss Tracker Dashboard</title>
	<script>
		(function () {
			const saved = localStorage.getItem('mapleBossTracker.theme');
			if (saved === 'light')
				document.documentElement.setAttribute('data-theme', 'light');
		})();
	</script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

		:root {
			--bg-void: #0a0c0f;
			--bg-panel: #12151a;
			--bg-card: #171b21;
			--bg-input: #0d1015;
			--hairline: #262b33;
			--hairline-soft: #1c2028;
			--text-primary: #e6e8eb;
			--text-secondary: #8b93a1;
			--text-muted: #5b6472;
			--maple-gold: #e3b341;
			--maple-gold-dim: #8a6a24;
			--warning-orange: #f59e0b;
			--warning-glow: rgba(245, 158, 11, 0.18);
			--success-green: #4fd97b;
			--success-glow: rgba(79, 217, 123, 0.18);
			--danger-red: #DC3545;
			--danger-glow: rgba(220, 53, 69, 0.18);
			--font-display: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			--font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
			--bg-button: #1d222a;
			--bg-button-hover: #262c36;
			--clear-hover-bg: #2a1518;
			--clear-hover-border: #b6413a;
			--clear-hover-text: #f28b82;
		}

		[data-theme="light"] {
			--bg-void: #f4f5f7;
			--bg-panel: #ffffff;
			--bg-card: #fbfbfc;
			--bg-input: #ffffff;
			--hairline: #d8dce2;
			--hairline-soft: #e4e7eb;
			--text-primary: #1c2028;
			--text-secondary: #4b5563;
			--text-muted: #8b93a1;
			--maple-gold: #b8860f;
			--maple-gold-dim: #d9b45c;
			--warning-orange: #c2740a;
			--warning-glow: rgba(194, 116, 10, 0.14);
			--success-green: #1f9d54;
			--success-glow: rgba(31, 157, 84, 0.14);
			--danger-red: #c22b3a;
			--danger-glow: rgba(194, 43, 58, 0.14);
			--bg-button: #ffffff;
			--bg-button-hover: #eef0f3;
			--clear-hover-bg: #fbe9ea;
			--clear-hover-border: #d9757e;
			--clear-hover-text: #b0303f;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background-color: var(--bg-void);
			background-image:
				radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227, 179, 65, 0.05), transparent),
				radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79, 217, 123, 0.04), transparent);
			color: var(--text-primary);
			font-family: var(--font-display);
			margin: 0;
			padding: 32px 24px 64px;
			transition: background-color 0.2s ease, color 0.2s ease;
		}

		.header-container {
			max-width: 1160px;
			margin: 0 auto 28px;
			padding: 0 4px;
			display: flex;
			align-items: baseline;
			gap: 14px;
		}

		.maple-mark {
			width: 26px;
			height: 26px;
			flex-shrink: 0;
			color: var(--maple-gold);
			transform: translateY(3px);
		}

		.page-title {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: -0.02em;
			color: var(--text-primary);
			margin: 0;
		}

		.page-credits {
			font-size: 13px;
			color: var(--text-muted);
			margin: 0;
			font-weight: 500;
		}

		.page-credits::before {
			content: "— ";
		}

		.page-frame {
			max-width: 1160px;
			margin: 0 auto;
			background-color: var(--bg-panel);
			border: 1px solid var(--hairline);
			box-sizing: border-box;
			padding: 28px 28px 32px;
			width: 100%;
			border-radius: 10px;
		}

		.config-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-bottom: 22px;
			margin-bottom: 22px;
			border-bottom: 1px solid var(--hairline);
		}

		.tools-row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 24px;
			padding-top: 22px;
			margin-top: 22px;
			border-top: 1px solid var(--hairline);
		}

		.form-group {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0;
		}

		label.main-label {
			font-weight: 700;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--text-secondary);
			min-width: unset;
		}

		input {
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 5px;
			color: var(--text-primary);
			font-family: var(--font-mono);
			font-size: 14px;
			padding: 6px 8px;
			transition: border-color 0.15s ease;
		}

		input:focus {
			outline: none;
			border-color: var(--maple-gold-dim);
		}

		input:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.input-channels,
		.input-time,
		.input-random {
			width: 56px;
			text-align: center;
		}

		.time-unit-label {
			font-size: 13px;
			color: var(--text-muted);
			margin-right: 6px;
		}

		input[type="time"]::-webkit-calendar-picker-indicator {
			filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			-webkit-filter: invert(60%) sepia(30%) saturate(500%) hue-rotate(360deg) !important;
			opacity: 0.8;
		}

		#timerContainer {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
			gap: 14px;
		}

		.timer-container {
			background-color: var(--bg-card);
			border: 1px solid var(--hairline-soft);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 16px;
			width: auto;
			transition: border-color 0.2s ease;
		}

		.timer-container.is-soon {
			border-color: var(--warning-orange);
			box-shadow: 0 0 0 1px var(--warning-glow), 0 0 24px -6px var(--warning-glow);
		}

		.timer-container.is-soon span {
			color: var(--warning-orange);
		}

		.timer-container.is-ready {
			border-color: var(--success-green);
			box-shadow: 0 0 0 1px var(--success-glow), 0 0 24px -6px var(--success-glow);
		}

		.timer-container.is-ready span {
			color: var(--success-green);
		}

		.timer-container.is-spawned {
			border-color: var(--danger-red);
			box-shadow: 0 0 0 1px var(--danger-glow), 0 0 24px -6px var(--danger-glow);
		}

		.timer-container.is-spawned span {
			color: var(--danger-red);
		}

		.timer-container .row-top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		button {
			background-color: var(--bg-button);
			border: 1px solid var(--hairline);
			border-radius: 6px;
			color: var(--text-primary);
			cursor: pointer;
			font-family: var(--font-display);
			font-size: 13px;
			font-weight: 700;
			min-width: unset;
			padding: 8px 14px;
			transition: all 0.15s ease-in-out;
		}

		button:hover {
			background-color: var(--bg-button-hover);
			border-color: var(--maple-gold-dim);
			color: var(--maple-gold);
		}

		button:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-group {
			gap: 8px;
		}

		.styled-checkbox {
			appearance: none;
			-webkit-appearance: none;
			width: 16px;
			height: 16px;
			margin: 0;
			background-color: var(--bg-input);
			border: 1px solid var(--hairline);
			border-radius: 4px;
			cursor: pointer;
			position: relative;
			transition: all 0.15s ease-in-out;
		}

		.styled-checkbox:hover {
			border-color: var(--maple-gold-dim);
		}

		.styled-checkbox:checked {
			background-color: var(--maple-gold);
			border-color: var(--maple-gold);
		}

		.styled-checkbox:checked::after {
			content: '';
			position: absolute;
			left: 4px;
			top: 1px;
			width: 4px;
			height: 8px;
			border: solid var(--bg-void);
			border-width: 0 2px 2px 0;
			transform: rotate(45deg);
		}

		.styled-checkbox:focus-visible {
			outline: 2px solid var(--maple-gold);
			outline-offset: 1px;
		}

		.checkbox-label {
			font-size: 13px;
			color: var(--text-secondary);
			cursor: pointer;
			user-select: none;
		}

		.record-input {
			width: 100%;
		}

		.respawn-label {
			font-size: 13px;
			font-weight: 600;
			color: var(--text-secondary);
			min-width: unset;
		}

		.range-label {
			font-size: 12px;
			font-weight: 500;
			color: var(--text-muted);
			font-family: var(--font-mono);
			min-width: unset;
		}

		.countdown-label {
			font-family: var(--font-mono);
			font-size: 20px;
			color: var(--maple-gold);
			font-weight: 700;
			min-width: unset;
			letter-spacing: 0.01em;
		}

		.clear-btn {
			align-self: flex-start;
			background: transparent;
			border-color: var(--hairline-soft);
			color: var(--text-muted);
			font-size: 12px;
			padding: 5px 10px;
		}

		.clear-btn:hover {
			background-color: var(--clear-hover-bg);
			border-color: var(--clear-hover-border);
			color: var(--clear-hover-text);
		}

		@media (max-width: 560px) {
			.page-frame {
				padding: 20px 16px;
				border-radius: 0;
			}

			.config-row {
				gap: 14px;
			}

			.tools-row {
				gap: 14px;
			}
		}

		.page-footer {
			margin-top: 28px;
			padding-top: 20px;
			border-top: 1px solid var(--hairline);
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}

		.footer-text {
			font-size: 13px;
			line-height: 1.6;
			color: var(--text-secondary);
			margin: 0 0 10px;
			max-width: 560px;
		}

		.footer-text:last-child {
			margin-bottom: 0;
		}

		.footer-text strong {
			color: var(--text-primary);
			font-weight: 700;
		}

		.theme-toggle {
			margin-left: auto;
			display: flex;
			align-items: center;
			align-self: center;
		}
	</style>
</head>

<body>
	<div class="header-container">
		<svg class="maple-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<path
				d="M12 1.5c.6 1.7 1 2.9 2 3.4.7-1 1.3-1.7 2.5-2-.1 1.3-.2 2.1.3 3.2 1-.5 1.7-.9 3-.8-.6 1.1-1 1.9-.9 3.1 1.1 0 1.9.1 2.9.8-1 .8-1.7 1.3-2 2.4 1 .3 1.7.6 2.4 1.6-1.2.4-2 .5-2.7 1.4.7.8 1.1 1.4 1.2 2.5-1.2-.2-2-.4-2.9.1.3 1 .5 1.8.1 2.9-1-.6-1.6-1.1-2.7-1-.1 1.1 0 1.9-.6 2.8-.8-.8-1.3-1.5-2.4-1.7-.2 1.1-.2 1.9-1 2.8-.8-.9-.8-1.7-1-2.8-1.1.2-1.6.9-2.4 1.7-.6-.9-.5-1.7-.6-2.8-1.1-.1-1.7.4-2.7 1-.4-1.1-.2-1.9.1-2.9-.9-.5-1.7-.3-2.9-.1.1-1.1.5-1.7 1.2-2.5-.7-.9-1.5-1-2.7-1.4.7-1 1.4-1.3 2.4-1.6-.3-1.1-1-1.6-2-2.4 1-.7 1.8-.8 2.9-.8.1-1.2-.3-2-.9-3.1 1.3-.1 2 .3 3 .8.5-1.1.4-1.9.3-3.2 1.2.3 1.8 1 2.5 2 1-.5 1.4-1.7 2-3.4z"
				fill="currentColor" />
			<path d="M12 14.5V22" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
		</svg>
		<div>
			<h1 class="page-title">Maple Boss Tracker</h1>
			<p class="page-credits">by Yoar</p>
		</div>
		<div class="theme-toggle">
			<button id="themeToggleButton" type="button">☀</button>
		</div>
	</div>

	<div class="page-frame">
		<!-- Configuration Panel -->
		<div class="config-row">
			<div class="form-group">
				<label for="channelInput" class="main-label">Channels</label>
				<input type="number" id="channelInput" class="input-channels">
			</div>

			<div class="form-group">
				<label class="main-label">Respawn Delay</label>
				<input type="number" id="delayHoursInput" class="input-time" min="0" step="1" value="1">
				<span class="time-unit-label">hr</span>
				<input type="number" id="delayMinutesInput" class="input-time" min="0" max="59" step="1" value="0">
				<span class="time-unit-label">min</span>
			</div>

			<div class="form-group">
				<label for="randomizationInput" class="main-label">Randomization</label>
				<input type="number" id="randomizationInput" class="input-random" min="0" max="100" step="1" value="15">
				<span class="time-unit-label">%</span>
			</div>
		</div>

		<!-- Timer Cards -->
		<div id="timerContainer"></div>

		<div class="tools-row">
			<button id="copyTimersButton" type="button">Copy Timers</button>
			<div class="form-group checkbox-group">
				<input type="checkbox" id="formatLocalTimeCheckbox" class="styled-checkbox">
				<label for="formatLocalTimeCheckbox" class="checkbox-label">Format Local Time</label>
			</div>
			<button id="clearTimersButton" type="button">Clear Timers</button>
		</div>

		<script>
			/* Configurations */
			const CHANNELS_MIN = 1;
			const CHANNELS_MAX = 12;
			const CHANNELS_DEFAULT = 6;
			const RANDOMIZATION_DEFAULT = 10;
			const SETTINGS_KEY = 'mapleBossTracker.settings';
			const PRESS_TIMES_KEY = 'mapleBossTracker.pressTimes';

			/* Get Element Handles */
			const channelInput = document.getElementById('channelInput');
			const delayHoursInput = document.getElementById('delayHoursInput');
			const delayMinutesInput = document.getElementById('delayMinutesInput');
			const randomizationInput = document.getElementById('randomizationInput');
			const timersContainer = document.getElementById('timerContainer');
			const formatLocalTimeCheckbox = document.getElementById('formatLocalTimeCheckbox');

			/* Initialize Inputs */
			channelInput.min = CHANNELS_MIN;
			channelInput.max = CHANNELS_MAX;
			channelInput.value = CHANNELS_DEFAULT;
			randomizationInput.value = RANDOMIZATION_DEFAULT;

			/* Load Settings, States */
			function saveSettings() {
				const settings = {
					channels: channelInput.value,
					delayHours: delayHoursInput.value,
					delayMinutes: delayMinutesInput.value,
					randomization: randomizationInput.value,
					formatLocalTime: formatLocalTimeCheckbox.checked
				};

				localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
			}

			function loadSettings() {
				try {
					const raw = localStorage.getItem(SETTINGS_KEY);

					if (!raw)
						return;

					const settings = JSON.parse(raw);

					if (settings.channels !== undefined)
						channelInput.value = settings.channels;
					if (settings.delayHours !== undefined)
						delayHoursInput.value = settings.delayHours;
					if (settings.delayMinutes !== undefined)
						delayMinutesInput.value = settings.delayMinutes;
					if (settings.randomization !== undefined)
						randomizationInput.value = settings.randomization;
					if (settings.formatLocalTime !== undefined)
						formatLocalTimeCheckbox.checked = settings.formatLocalTime;
				} catch (e) {
					console.warn('Could not load saved settings:', e);
				}
			}

			function saveStates() {
				const data = timerStates.map(s => s.pressTime ? s.pressTime.toISOString() : null);

				localStorage.setItem(PRESS_TIMES_KEY, JSON.stringify(data));
			}

			function loadStates() {
				try {
					const raw = localStorage.getItem(PRESS_TIMES_KEY);

					if (!raw)
						return;

					const data = JSON.parse(raw);

					data.forEach((iso, i) => {
						if (iso && timerStates[i]) {
							timerStates[i].pressTime = new Date(iso);
						}
					});
				} catch (e) {
					console.warn('Could not load saved timers:', e);
				}
			}

			/* Init. Settings, Timer States */
			const timerStates = Array.from({ length: CHANNELS_MAX }, () => ({
				pressTime: null
			}));

			loadSettings();
			loadStates();

			/* Utility Functions */
			function toggleClass(element, classNames, classIndex) {
				for (let i = 0; i < classNames.length; i++) {
					element.classList.toggle(classNames[i], classIndex == i);
				}
			}

			function formatTime(time) {
				const hours = Math.floor(time / (1000 * 60 * 60));
				const minutes = Math.floor((time % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((time % (1000 * 60)) / 1000);

				const mm = minutes.toString().padStart(2, '0');
				const ss = seconds.toString().padStart(2, '0');

				if (hours > 0)
					return `${hours}:${mm}:${ss}`;
				else
					return `${mm}:${ss}`;
			}

			function timeStringToDate(timeString) {
				const now = new Date();
				const year = now.getFullYear();
				const MM = String(now.getMonth() + 1).padStart(2, '0');
				const DD = String(now.getDate()).padStart(2, '0');
				const dateString = `${year}-${MM}-${DD}`;
				const dateTimeString = `${dateString}T${timeString}`;
				const date = new Date(dateTimeString);
				const halfDayMs = 43200000; // 24 * 60 * 60 * 1000 / 2;

				// If it's at least 12 hours in the future, assume the user meant yesterday
				if ((date.getTime() - now.getTime()) > halfDayMs)
					date.setDate(date.getDate() - 1);

				return date;
			}

			function formatTimeIcon(time, delayVariationMs) {
				if (time <= -2 * delayVariationMs)
					return '⚠️';
				else if (time <= 0)
					return '✔️';
				else
					return formatTime(time);
			}

			/* Main Functions */
			const COUNTDOWN_STAGES = ['is-soon', 'is-ready', 'is-spawned'];
			const SOON_THRESHOLD_MS = 300000;

			function updateTimer(timerContainer, timerState) {
				if (timerState.pressTime === null)
					return;

				let delayHours = parseInt(delayHoursInput.value) || 0;
				let delayMinutes = parseInt(delayMinutesInput.value) || 0;
				let delayRandPerc = parseInt(randomizationInput.value) || 0;

				const pressTime = timerState.pressTime;
				const delayMs = ((delayHours * 60) + delayMinutes) * 60 * 1000;
				const delayRandMs = delayRandPerc * delayMs / 100;
				const respawnAvgTime = new Date(pressTime.getTime() + delayMs);
				const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
				const respawnMaxTime = new Date(respawnAvgTime.getTime() + delayRandMs);
				const now = new Date();
				const timeRemaining = respawnMinTime.getTime() - now.getTime();

				const recordInput = timerContainer.querySelector('#recordInput');
				const respawnAvgLabel = timerContainer.querySelector('#respawnAvgLabel');
				const respawnMinLabel = timerContainer.querySelector('#respawnMinLabel');
				const respawnMaxLabel = timerContainer.querySelector('#respawnMaxLabel');
				const countdownLabel = timerContainer.querySelector('#countdownLabel');

				if (recordInput) {
					const hh = String(pressTime.getHours()).padStart(2, '0');
					const mm = String(pressTime.getMinutes()).padStart(2, '0');

					recordInput.value = `${hh}:${mm}`;
				}

				if (respawnAvgLabel)
					respawnAvgLabel.textContent = `Expected Respawn: ${respawnAvgTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

				if (respawnMinLabel)
					respawnMinLabel.textContent = `Min Respawn: ${respawnMinTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

				if (respawnMaxLabel)
					respawnMaxLabel.textContent = `Max Respawn: ${respawnMaxTime.toLocaleTimeString(undefined, { timeStyle: 'short' })}`;

				if (countdownLabel) {
					if (timeRemaining <= -2 * delayRandMs) {
						toggleClass(timerContainer, COUNTDOWN_STAGES, 2);
						countdownLabel.textContent = "Spawned!";
					} else if (timeRemaining <= 0) {
						toggleClass(timerContainer, COUNTDOWN_STAGES, 1);
						countdownLabel.textContent = "Ready!";
					} else {
						if (timeRemaining <= SOON_THRESHOLD_MS)
							toggleClass(timerContainer, COUNTDOWN_STAGES, 0);
						else
							toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
						countdownLabel.textContent = `Remaining: ${formatTime(timeRemaining)}`;
					}
				}
			}

			function clearTimer(timerContainer, timerState) {
				const recordInput = timerContainer.querySelector('#recordInput');
				const respawnAvgLabel = timerContainer.querySelector('#respawnAvgLabel');
				const respawnMinLabel = timerContainer.querySelector('#respawnMinLabel');
				const respawnMaxLabel = timerContainer.querySelector('#respawnMaxLabel');
				const countdownLabel = timerContainer.querySelector('#countdownLabel');

				if (recordInput)
					recordInput.value = '';

				if (respawnAvgLabel)
					respawnAvgLabel.textContent = '';

				if (respawnMinLabel)
					respawnMinLabel.textContent = '';

				if (respawnMaxLabel)
					respawnMaxLabel.textContent = '';

				if (countdownLabel)
					countdownLabel.textContent = '';

				toggleClass(timerContainer, COUNTDOWN_STAGES, -1);
				timerState.pressTime = null;
			}

			function createTimerContainer(index) {
				const timerContainer = document.createElement('div');
				timerContainer.className = 'timer-container';

				const recordButton = document.createElement('button');
				recordButton.textContent = `Channel ${index + 1}`;

				const recordInput = document.createElement('input');
				recordInput.id = 'recordInput';
				recordInput.className = "record-input"
				recordInput.type = "time";
				recordInput.min = "00:00"
				recordInput.max = "23:59"
				recordInput.step = "60"

				const respawnAvgLabel = document.createElement('span');
				respawnAvgLabel.id = 'respawnAvgLabel';
				respawnAvgLabel.className = 'respawn-label';

				const respawnMinLabel = document.createElement('span');
				respawnMinLabel.id = 'respawnMinLabel';
				respawnMinLabel.className = 'range-label';

				const respawnMaxLabel = document.createElement('span');
				respawnMaxLabel.id = 'respawnMaxLabel';
				respawnMaxLabel.className = 'range-label';

				const countdownLabel = document.createElement('span');
				countdownLabel.id = 'countdownLabel';
				countdownLabel.className = 'countdown-label';

				const clearButton = document.createElement('button');
				clearButton.textContent = 'Clear';
				clearButton.className = 'clear-btn';

				const rowTop = document.createElement('div');
				rowTop.className = 'row-top';

				const timerState = timerStates[index];

				recordButton.addEventListener('click', () => {
					timerState.pressTime = new Date();
					updateTimer(timerContainer, timerState);
					updateDocumentTitle();
					saveStates();
				});

				recordInput.addEventListener('change', (event) => {
					timerState.pressTime = timeStringToDate(event.target.value);
					updateTimer(timerContainer, timerState);
					updateDocumentTitle();
					saveStates();
				});

				clearButton.addEventListener('click', () => {
					clearTimer(timerContainer, timerState);
					updateDocumentTitle();
					saveStates();
				});

				rowTop.appendChild(recordButton);
				rowTop.appendChild(clearButton);

				timerContainer.appendChild(rowTop);
				timerContainer.appendChild(recordInput);
				timerContainer.appendChild(countdownLabel);
				timerContainer.appendChild(respawnAvgLabel);
				timerContainer.appendChild(respawnMinLabel);
				timerContainer.appendChild(respawnMaxLabel);

				return timerContainer;
			}

			function ensureAllTimerContainers() {
				let channelCount = parseInt(channelInput.value) || CHANNELS_DEFAULT;

				if (channelCount < CHANNELS_MIN)
					channelCount = CHANNELS_MIN;
				else if (channelCount > CHANNELS_MAX)
					channelCount = CHANNELS_MAX;

				channelInput.value = channelCount;

				const currentCount = timersContainer.getElementsByClassName('timer-container').length;

				if (channelCount > currentCount) {
					for (let i = currentCount; i < channelCount; i++) {
						timerContainer = createTimerContainer(i);

						timersContainer.appendChild(timerContainer);

						updateTimer(timerContainer, timerStates[i]);
					}
				} else if (channelCount < currentCount) {
					while (timersContainer.getElementsByClassName('timer-container').length > channelCount) {
						const lastRow = timersContainer.lastElementChild;

						timersContainer.removeChild(lastRow);
					}
				}
			}

			const DOCUMENT_TITLE = document.title;

			function formatDocumentTitle() {
				let delayHours = parseInt(delayHoursInput.value) || 0;
				let delayMinutes = parseInt(delayMinutesInput.value) || 0;
				let delayRandPerc = parseInt(randomizationInput.value) || 0;

				const delayMs = ((delayHours * 60) + delayMinutes) * 60 * 1000;
				const delayRandMs = delayRandPerc * delayMs / 100;

				const list = [];

				for (let i = 0; i < CHANNELS_MAX; i++) {
					const timerState = timerStates[i];

					if (timerState.pressTime === null)
						continue;

					const respawnAvgTime = new Date(timerState.pressTime.getTime() + delayMs);
					const respawnMinTime = new Date(respawnAvgTime.getTime() - delayRandMs);
					const now = new Date();
					const timeRemaining = respawnMinTime.getTime() - now.getTime();

					list.push({ channel: i + 1, timeRemaining: timeRemaining })
				}

				if (list.length == 0)
					return DOCUMENT_TITLE;

				list.sort((a, b) => a.timeRemaining - b.timeRemaining);

				const toDisplay = 3;

				const timers = list
					.slice(0, toDisplay)
					.map(item => `ch${item.channel}: ${formatTimeIcon(item.timeRemaining, delayRandMs)}`)
					.join(', ');

				return `⌚${timers}`;
			}

			/* Helpers */
			function updateAllTimers() {
				children = timersContainer.getElementsByClassName('timer-container');

				for (let i = 0; i < children.length; i++) {
					updateTimer(children[i], timerStates[i]);
				}
			}

			function clearAllTimers() {
				children = timersContainer.getElementsByClassName('timer-container');

				for (let i = 0; i < children.length; i++) {
					clearTimer(children[i], timerStates[i]);
				}

				updateDocumentTitle();
				saveStates();
			}

			function updateDocumentTitle() {
				document.title = formatDocumentTitle();
			}

			function updateContent() {
				updateAllTimers();
				updateDocumentTitle();
			}

			/* Input Events */
			channelInput.addEventListener('input', () => {
				ensureAllTimerContainers();
				saveSettings();
			});

			delayHoursInput.addEventListener('change', () => {
				if (parseInt(delayHoursInput.value) < 0)
					delayHoursInput.value = 0;

				updateContent();
				saveSettings();
			});

			delayMinutesInput.addEventListener('change', () => {
				let minutes = parseInt(delayMinutesInput.value);

				if (minutes < 0)
					delayMinutesInput.value = 0;
				else if (minutes > 59)
					delayMinutesInput.value = 59;

				updateContent();
				saveSettings();
			});

			randomizationInput.addEventListener('change', () => {
				let randomization = parseInt(randomizationInput.value);

				if (randomization < 0)
					randomizationInput.value = 0;
				else if (randomization > 100)
					randomizationInput.value = 100;

				updateContent();
				saveSettings();
			});

			/* Init. Content */
			ensureAllTimerContainers();
			updateDocumentTitle();

			/* Main Tick */
			setInterval(updateContent, 1000);

			/* Set Timers to Clipboard */
			function formatTimers() {
				let delayHours = parseInt(delayHoursInput.value) || 0;
				let delayMinutes = parseInt(delayMinutesInput.value) || 0;
				let formatLocalTime = formatLocalTimeCheckbox.checked;

				const delayMs = ((delayHours * 60) + delayMinutes) * 60 * 1000;

				const lines = [];

				for (let i = 0; i < CHANNELS_MAX; i++) {
					const timerState = timerStates[i];

					if (timerState.pressTime === null)
						continue;

					const respawnAvgTime = new Date(timerState.pressTime.getTime() + delayMs);
					const hh = formatLocalTime ? String(respawnAvgTime.getHours()).padStart(2, '0') : 'xx';
					const mm = String(respawnAvgTime.getMinutes()).padStart(2, '0');

					lines.push(`ch${i + 1}: ${hh}:${mm}`);
				}

				return lines.join('\n');
			}

			function setTimersToClipboard() {
				const text = formatTimers();

				navigator.clipboard.writeText(text).then(() => {
					const original = copyTimersButton.textContent;
					copyTimersButton.textContent = 'Copied!';
					setTimeout(() => { copyTimersButton.textContent = original; }, 1200);
				}).catch(err => {
					console.warn('Clipboard write failed:', err);
				});
			}

			document.getElementById('copyTimersButton').addEventListener('click', setTimersToClipboard);

			formatLocalTimeCheckbox.addEventListener('change', saveSettings);

			document.getElementById('clearTimersButton').addEventListener('click', clearAllTimers);

			/* Theme Toggle */
			const THEME_KEY = 'mapleBossTracker.theme';
			const themeToggleButton = document.getElementById('themeToggleButton');

			function applyThemeButtonLabel() {
				const isLight = document.documentElement.getAttribute('data-theme') === 'light';

				themeToggleButton.textContent = isLight ? '☾' : '☀';
			}

			function toggleTheme() {
				const isLight = document.documentElement.getAttribute('data-theme') === 'light';

				if (isLight) {
					document.documentElement.removeAttribute('data-theme');
					localStorage.setItem(THEME_KEY, 'dark');
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					localStorage.setItem(THEME_KEY, 'light');
				}

				applyThemeButtonLabel();
			}

			themeToggleButton.addEventListener('click', toggleTheme);

			applyThemeButtonLabel();
		</script>
	</div>
